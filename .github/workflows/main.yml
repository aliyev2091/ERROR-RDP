name: ERROR-4004

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Show Processor Information
        run: |
          Write-Host "`n==================== PROCESSOR INFORMATION ====================" -ForegroundColor Cyan
          $cpu = Get-CimInstance Win32_Processor
          Write-Host "Processor Name           : $($cpu.Name)"
          Write-Host "Manufacturer             : $($cpu.Manufacturer)"
          Write-Host "Number of Cores          : $($cpu.NumberOfCores)"
          Write-Host "Logical Processors       : $($cpu.NumberOfLogicalProcessors)"
          Write-Host "Max Clock Speed (MHz)    : $($cpu.MaxClockSpeed)"
          Write-Host "Current Clock Speed (MHz): $($cpu.CurrentClockSpeed)"
          Write-Host "Architecture             : $($cpu.Architecture)"
          Write-Host "Socket Designation       : $($cpu.SocketDesignation)"
          Write-Host "Processor ID             : $($cpu.ProcessorId)"
          Write-Host "==============================================================`n" -ForegroundColor Cyan

      - name: Maximum Disk Cleanup
        run: |
          Write-Host "`n========== MAXIMUM DISK CLEANUP STARTED ==========" -ForegroundColor Yellow

          $safeToRemove = @(
            "Microsoft.BingWeather","Microsoft.BingNews","Microsoft.GetHelp","Microsoft.Getstarted",
            "Microsoft.WindowsFeedbackHub","Microsoft.MicrosoftOfficeHub","Microsoft.Todos",
            "Microsoft.PowerAutomateDesktop","Microsoft.Windows.Photos","Microsoft.ScreenSketch",
            "Microsoft.MSPaint","Microsoft.WindowsCamera","Microsoft.WindowsAlarms",
            "Microsoft.WindowsSoundRecorder","Microsoft.People","Microsoft.SkypeApp",
            "Clipchamp.Clipchamp","Microsoft.Xbox*","Microsoft.GamingApp","Microsoft.ZuneMusic",
            "Microsoft.ZuneVideo","Microsoft.YourPhone","Microsoft.WindowsMaps",
            "Microsoft.MicrosoftSolitaireCollection","Microsoft.549981C3F5F10","MicrosoftTeams",
            "Microsoft.OneDriveSync"
          )
          foreach ($app in $safeToRemove) {
              Get-AppxPackage -Name $app -ErrorAction SilentlyContinue | Remove-AppxPackage -ErrorAction SilentlyContinue
              Get-AppxProvisionedPackage -Online -ErrorAction SilentlyContinue | 
                  Where-Object { $_.DisplayName -like $app } | 
                  Remove-AppxProvisionedPackage -Online -ErrorAction SilentlyContinue
          }

          taskkill /f /im OneDrive.exe 2>$null
          if (Test-Path "$env:SystemRoot\SysWOW64\OneDriveSetup.exe") {
              Start-Process "$env:SystemRoot\SysWOW64\OneDriveSetup.exe" -ArgumentList "/uninstall" -Wait -ErrorAction SilentlyContinue
          }
          if (Test-Path "$env:SystemRoot\System32\OneDriveSetup.exe") {
              Start-Process "$env:SystemRoot\System32\OneDriveSetup.exe" -ArgumentList "/uninstall" -Wait -ErrorAction SilentlyContinue
          }

          $servicesToDisable = @(
            "DiagTrack","dmwappushservice","SysMain","WSearch","XblAuthManager","XblGameSave",
            "XboxGipSvc","XboxNetApiSvc","WMPNetworkSvc","Fax","RemoteRegistry","RetailDemo",
            "MapsBroker","WerSvc","Spooler","lfsvc","bthserv","CDPSvc","SSDPSRV","upnphost",
            "TabletInputService"
          )
          foreach ($svc in $servicesToDisable) {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          $foldersToDelete = @(
            "C:\Program Files (x86)\Android",
            "C:\Android",
            "C:\Program Files\Android",
            "C:\Program Files\dotnet\sdk",
            "C:\Program Files\dotnet\shared",
            "C:\Program Files\dotnet\host",
            "C:\Program Files\dotnet\packs",
            "C:\Program Files\dotnet\templates",
            "C:\Program Files\Microsoft Visual Studio",
            "C:\Program Files (x86)\Microsoft Visual Studio",
            "C:\Program Files\Microsoft SDKs",
            "C:\Program Files (x86)\Microsoft SDKs",
            "C:\Program Files\LLVM",
            "C:\Program Files (x86)\LLVM",
            "C:\Program Files\CMake",
            "C:\Program Files\Git\mingw64\share",
            "C:\ProgramData\chocolatey\lib",
            "C:\ProgramData\chocolatey\bin",
            "C:\Users\runneradmin\AppData\Local\Temp",
            "C:\Users\runneradmin\AppData\Local\npm-cache",
            "C:\Users\runneradmin\AppData\Local\Yarn",
            "C:\Users\runneradmin\AppData\Local\Pip",
            "C:\Users\runneradmin\AppData\Local\go-build",
            "C:\Users\runneradmin\go",
            "C:\Users\runneradmin\.nuget",
            "C:\Users\runneradmin\.cache",
            "C:\Users\runneradmin\AppData\Local\Microsoft\VisualStudio",
            "C:\Windows\SoftwareDistribution\Download",
            "C:\Windows\Temp",
            "C:\Windows\Prefetch",
            "C:\Windows\Logs",
            "C:\Windows\System32\LogFiles"
          )

          foreach ($folder in $foldersToDelete) {
              if (Test-Path $folder) {
                  Write-Host "Deleting: $folder"
                  Remove-Item -Path $folder -Recurse -Force -ErrorAction SilentlyContinue
              }
          }

          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\Prefetch\*" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\SoftwareDistribution\Download\*" -Recurse -Force -ErrorAction SilentlyContinue

          try {
              $cs = Get-CimInstance -ClassName Win32_ComputerSystem
              Set-CimInstance -InputObject $cs -Property @{AutomaticManagedPagefile = $false}
              
              $pagefile = Get-CimInstance -ClassName Win32_PageFileSetting -Filter "Name='C:\\pagefile.sys'" -ErrorAction SilentlyContinue
              if ($pagefile) {
                  Set-CimInstance -InputObject $pagefile -Property @{InitialSize = 512; MaximumSize = 1024}
              }
          } catch {
              Write-Host "Pagefile ayarı atlandı"
          }

          powercfg /h off 2>$null
          Dism.exe /online /Cleanup-Image /StartComponentCleanup /ResetBase 2>$null

          $tasks = @(
            "\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser",
            "\Microsoft\Windows\Application Experience\ProgramDataUpdater",
            "\Microsoft\Windows\Customer Experience Improvement Program\Consolidator",
            "\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip",
            "\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector",
            "\Microsoft\Windows\Feedback\Siuf\DmClient",
            "\Microsoft\Windows\Feedback\Siuf\DmClientOnScenarioDownload",
            "\Microsoft\Windows\Windows Error Reporting\QueueReporting"
          )
          foreach ($task in $tasks) {
              schtasks /Change /TN $task /Disable 2>$null
          }

          Write-Host "`n========== DISK STATUS ==========" -ForegroundColor Cyan
          Get-PSDrive C | Select-Object Used,Free | Format-List
          Write-Host "========== MAXIMUM DISK CLEANUP COMPLETED ==========`n" -ForegroundColor Green

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          $password = "Password!?"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "ERROR-4004" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "ERROR-4004"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "ERROR-4004"
          echo "RDP_CREDS=User: ERROR-4004 | Password: $password" >> $env:GITHUB_ENV
          if (-not (Get-LocalUser -Name "ERROR-4004")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          
          $process = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$installerPath`" /qn /norestart ALLUSERS=1" -Wait -PassThru
          Write-Host "MSI Exit Code: $($process.ExitCode)"
          
          Start-Sleep -Seconds 15
          
          # Olası tüm yerleri tara
          $tsExe = Get-ChildItem -Path "C:\Program Files","C:\Program Files (x86)","C:\ProgramData" -Filter "tailscale.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          
          if (-not $tsExe) {
              # Servis üzerinden dene
              Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 5
              $tsExe = Get-ChildItem -Path "C:\Program Files","C:\Program Files (x86)" -Filter "tailscale.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          
          if (-not $tsExe) {
              Write-Error "Tailscale executable not found after install"
              Get-ChildItem "C:\Program Files" -ErrorAction SilentlyContinue | Select-Object Name
              exit 1
          }
          
          echo "TAILSCALE_EXE=$tsExe" >> $env:GITHUB_ENV
          Write-Host "Tailscale found at: $tsExe"

      - name: Establish Tailscale Connection
        run: |
          $tsExe = $env:TAILSCALE_EXE
          if (-not $tsExe -or -not (Test-Path $tsExe)) {
              Write-Error "Tailscale executable not found"
              exit 1
          }

          & "$tsExe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID --accept-routes=false

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 20) {
              try {
                  $tsIP = & "$tsExe" ip -4 2>$null
              } catch {}
              Start-Sleep -Seconds 4
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned"
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $tsIP"

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: ERROR-4004"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
