name: ERROR-4004

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 3600 # 60 saat
    
    steps:
      # ==========================================
      # 1. DETAYLI SİSTEM BİLGİLERİ VE KESİN DİSK TESPİTİ
      # ==========================================
      - name: DETAYLI SISTEM DONANIM BILGILERI
        id: sys_info
        run: |
          Write-Host "================================================================="
          Write-Host "                 DETAYLI SISTEM BILGILERI                        "
          Write-Host "================================================================="
          
          $cpu = Get-CimInstance -ClassName Win32_Processor
          Write-Host "[+] Islemci (CPU)   : $($cpu.Name)"
          Write-Host "    -> Cekirdek      : $($cpu.NumberOfCores) Fiziksel / $($cpu.NumberOfLogicalProcessors) Mantiksal"
          
          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          Write-Host "[+] Isletim Sistemi : $($os.Caption) (Build: $($os.BuildNumber))"
          
          $ram = [math]::Round((Get-CimInstance -ClassName Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          Write-Host "[+] RAM Miktari     : $ram GB"
          
          # DİSK TESPİTİ (Kesin WMI Yöntemi)
          $mediaType = "SSD"
          try {
              $diskInfo = Get-CimInstance -ClassName Win32_DiskDrive | Where-Object { $_.Index -eq 0 }
              if ($diskInfo.Model -match "NVMe|SSD|Solid State") {
                  $mediaType = "SSD"
              } elseif ($diskInfo.MediaType -match "Fixed hard disk") {
                  $mediaType = "HDD"
              }
          } catch {
              $mediaType = "SSD"
          }
          Write-Host "[+] Disk Tipi       : $mediaType"
          
          $diskC = Get-CimInstance -ClassName Win32_LogicalDisk -Filter "DeviceID='C:'"
          $freeGB = [math]::Round($diskC.FreeSpace / 1GB, 2)
          $totalGB = [math]::Round($diskC.Size / 1GB, 2)
          Write-Host "-----------------------------------------------------------------"
          Write-Host "[+] C: Surucusu     : $freeGB GB Bos / $totalGB GB Toplam"
          Write-Host "================================================================="
          Write-Host "Cekirdek temizlik baslatiliyor..."
          exit 0

      - name: Tailscale'i Başlat
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Kullanıcı Oluştur, Full Admin Yap ve RDP'yi Etkinleştir
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $Password = ConvertTo-SecureString -AsPlainText "${{ secrets.ERROR_4004_PASSWORD }}" -Force
          if (-not (Get-LocalUser -Name "ERROR-4004" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "ERROR-4004" -Password $Password -PasswordNeverExpires -AccountNeverExpires
          } else { Set-LocalUser -Name "ERROR-4004" -Password $Password }
          Add-LocalGroupMember -Group "Administrators" -Member "ERROR-4004" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "ERROR-4004" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "EnableLUA" -Value 0 -Type DWord -Force
          exit 0

      # ==========================================
      # 2. DOSYALARI KİLİTLEYEN SÜREÇLERİ ZORLA ÖLDÜR
      # ==========================================
      - name: Dosya Kilitlerini Aç (Agresif Süreç Öldürme)
        run: |
          Write-Host "Kilitli dosyalari tutan süreçler zorla kapatiliyor..."
          cmd.exe /c "taskkill /F /IM msiexec.exe /T" > $null 2>&1
          cmd.exe /c "taskkill /F /IM ServiceFabricLocalClusterManager.exe /T" > $null 2>&1
          cmd.exe /c "taskkill /F /IM VBCSCompiler.exe /T" > $null 2>&1
          cmd.exe /c "taskkill /F /IM MSBuild.exe /T" > $null 2>&1
          
          $processes = Get-Process | Where-Object { $_.Path -match "Visual Studio|ServiceFabric|dotnet|java|node|docker|Unity|git|postgres|mysql" }
          foreach ($p in $processes) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          
          $killerServices = @("Docker*", "SQL*", "MSSQL*", "com.docker*", "WSearch", "SysMain", "WinDefend", "wuauserv", "EventLog", "TrustedInstaller", "DoSvc", "postgresql*", "MySQL*")
          foreach ($svc in $killerServices) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }
          exit 0

      # ==========================================
      # 3. .NET ÇEKİRDEK MOTORU (Zaman Sınırı Yok, Zorla Kapatma Yok)
      # ==========================================
      - name: HYPERSPEED SİLME (Hedef Maksimum Temizlik)
        run: |
          Write-Host "Silme islemleri .NET Cekirdek Motoru ile baslatiliyor..."
          
          # Silinecek devasa klasörlerin listesi
          $foldersToDelete = @(
            "C:\hostedtoolcache",
            "C:\Program Files\Microsoft Visual Studio",
            "C:\Program Files (x86)\Microsoft Visual Studio",
            "C:\ProgramData\Microsoft\VisualStudio",
            "C:\Program Files\Microsoft SQL Server",
            "C:\Program Files\Android",
            "C:\Program Files\Git",
            "C:\Program Files\Docker",
            "C:\ProgramData\Docker",
            "C:\ProgramData\Package Cache",
            "C:\Windows\SoftwareDistribution",
            "C:\Program Files\Google",
            "C:\Program Files (x86)\Microsoft\Edge",
            "C:\Program Files\PostgreSQL",
            "C:\Program Files\MySQL",
            "C:\Program Files\R",
            "C:\Program Files\Rtools",
            "C:\Program Files\nodejs",
            "C:\Program Files\dotnet",
            "C:\Program Files\Java",
            "C:\Program Files\Azure",
            "C:\ProgramData\chocolatey",
            "C:\Users\runneradmin\.nuget",
            "C:\Users\runneradmin\.m2",
            "C:\Users\runneradmin\.gradle",
            "C:\Users\runneradmin\.android",
            "C:\Users\runneradmin\AppData\Local\Temp",
            "C:\ProgramData\Microsoft\Network\Downloader",
            "C:\Windows\Temp",
            "C:\Windows\Prefetch"
          )

          foreach ($folder in $foldersToDelete) {
            if (Test-Path $folder) {
              Write-Host "Siliniyor: $folder"
              try {
                # .NET Çekirdek Komutu: Diske sormadan direkt siler. HDD/SSD fark etmez, çok hızlıdır.
                [System.IO.Directory]::Delete($folder, $true)
              } catch {
                # Eğer .NET kilitli bir dosya görürse hata vermesin, CMD ile yedek plan devreye girsin
                cmd.exe /c "rd /s /q `"$folder`"" > $null 2>&1
              }
            }
          }
          
          Write-Host "Silme islemi tamamlandi!"
          exit 0

      - name: HAYALET UYGULAMALARI VE KAYIT DEFTERİNİ SİL
        run: |
          cmd.exe /c "rd /s /q C:\Users\Public\Desktop" > $null 2>&1
          cmd.exe /c "rd /s /q C:\Users\runneradmin\Desktop" > $null 2>&1
          cmd.exe /c "rd /s /q C:\Users\ERROR-4004\Desktop" > $null 2>&1
          New-Item -ItemType Directory -Force -Path "C:\Users\Public\Desktop" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\Users\ERROR-4004\Desktop" | Out-Null

          $uninstallPaths = @("HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*", "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*", "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*")
          foreach ($path in $uninstallPaths) {
            Get-ItemProperty $path -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match "Edge|Chrome|Python|Unity|Visual Studio|Docker" } | ForEach-Object { Remove-Item -Path $_.PSPath -Recurse -Force -ErrorAction SilentlyContinue }
          }
          exit 0

      - name: SANAL BELLEK (PAGEFILE) VE TEMP TEMİZLİĞİ
        run: |
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" -Name "PagingFiles" -Value @() -Type MultiString -Force
          powercfg -h off
          vssadmin delete shadows /all /quiet
          
          New-Item -ItemType Directory -Force -Path "C:\Windows\Temp" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\Windows\Prefetch" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\Windows\SoftwareDistribution" | Out-Null
          exit 0

      - name: Firefox'u Kur ve Masaüstüne At
        run: |
          $firefoxUrl = "https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US"
          Invoke-WebRequest -Uri $firefoxUrl -OutFile "$env:TEMP\firefox_installer.exe"
          Start-Process -FilePath "$env:TEMP\firefox_installer.exe" -ArgumentList "/S" -Wait
          $WshShell = New-Object -ComObject WScript.Shell
          $Shortcut1 = $WshShell.CreateShortcut("C:\Users\Public\Desktop\Firefox.lnk")
          $Shortcut1.TargetPath = "C:\Program Files\Mozilla Firefox\firefox.exe"
          $Shortcut1.Save()
          $Shortcut2 = $WshShell.CreateShortcut("C:\Users\ERROR-4004\Desktop\Firefox.lnk")
          $Shortcut2.TargetPath = "C:\Program Files\Mozilla Firefox\firefox.exe"
          $Shortcut2.Save()
          exit 0

      - name: Servisleri Kapat ve FULL PERFORMANS
        run: |
          $services = @("SysMain", "WSearch", "Spooler", "DiagTrack", "XblAuthManager", "XblGameSave", "XboxNetApiSvc", "WMPNetworkSvc", "wuauserv", "MapsBroker", "lfsvc")
          foreach ($svc in $services) { Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue; Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue }
          powercfg -setactive e9a42b02-d5df-448d-aa00-03f14749eb61
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SelectTransport" -Value 2
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "InteractiveDelay" -Value 0
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "DWMFRAMEINTERVAL" -Value 15 -Type DWord -Force
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "Wallpaper" -Value ""
          ipconfig /flushdns
          exit 0

      - name: Bağlantı Bilgilerini Göster
        run: |
          Write-Host "===================================="
          Write-Host "     ERROR-4004 HYPERSPEED TEMİZLİK "
          Write-Host "===================================="
          Write-Host "Tailscale IP:"
          tailscale ip -4
          Write-Host "Kullanici Adi : ERROR-4004"
          Write-Host "Parola        : (Secrets -> ERROR_4004_PASSWORD)"
          Write-Host "===================================="
          $disk = Get-CimInstance -ClassName Win32_LogicalDisk -Filter "DeviceID='C:'"
          Write-Host "C: SURUCUSUNDEKI GUNCEL BOS ALAN: $([math]::Round($disk.FreeSpace/1GB,2)) GB"
          exit 0
          
      - name: Sistemi 60 Saat Boyunca Açık Tut
        run: |
          Write-Host "Islem tamam. 60 saat uyku basliyor..."
          Start-Sleep -Seconds 216000 
