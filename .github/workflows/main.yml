              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
              sc.exe config $svc start= disabled 2>$null | Out-Null
              $global:LASTEXITCODE = 0
          }

          reg add "HKLM\SOFTWARE\Microsoft\Windows Defender\Features" /v "TamperProtection" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\WinDefend" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\WdNisSvc" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\Sense" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\MsSense" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\SecurityHealthService" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\wscsvc" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\MpDefenderCoreService" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\WdFilter" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1

          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v "SubscribedContent-338389Enabled" /t REG_DWORD /d 0 /f >$null 2>&1
