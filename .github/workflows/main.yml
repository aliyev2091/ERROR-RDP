name: ERROR-4004

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Show Complete System Information
        run: |
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "                 DETAYLI SISTEM BILGILERI                   " -ForegroundColor Cyan
          Write-Host "============================================================" -ForegroundColor Cyan
          
          $os = Get-CimInstance Win32_OperatingSystem
          $cs = Get-CimInstance Win32_ComputerSystem
          $cpu = Get-CimInstance Win32_Processor
          
          Write-Host "[!] Isletim Sistemi : $($os.Caption) ($($os.Version))"
          Write-Host "[!] Bilgisayar Adi  : $($cs.Name)"
          Write-Host "[!] Uptime          : $([math]::Round(((Get-Date) - $os.LastBootUpTime).TotalMinutes, 0)) Dakika"
          
          Write-Host "`n--- ISLEMCI (CPU) ---" -ForegroundColor Yellow
          Write-Host "Model               : $($cpu.Name)"
          Write-Host "Cekirdek / Thread   : $($cpu.NumberOfCores) Cekirdek / $($cpu.NumberOfLogicalProcessors) Thread"
          Write-Host "Hiz (MHz)           : $($cpu.CurrentClockSpeed) MHz (Max: $($cpu.MaxClockSpeed) MHz)"
          
          Write-Host "`n--- BELLEK (RAM) ---" -ForegroundColor Yellow
          $totalRam = [math]::Round($os.TotalVisibleMemorySize / 1MB, 2)
          $freeRam  = [math]::Round($os.FreePhysicalMemory / 1MB, 2)
          Write-Host "Toplam RAM          : $totalRam GB"
          Write-Host "Bos RAM             : $freeRam GB"
          
          Write-Host "`n--- DEPOLAMA (DISK) ---" -ForegroundColor Yellow
          $logicalDisks = Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3"
          foreach ($ld in $logicalDisks) {
              $totalGB = [math]::Round($ld.Size / 1GB, 2)
              $freeGB  = [math]::Round($ld.FreeSpace / 1GB, 2)
              $usedGB  = [math]::Round($totalGB - $freeGB, 2)
              Write-Host "$($ld.DeviceID) Surucusu       : $usedGB GB Kullanilan | $freeGB GB Bos | $totalGB GB Toplam"
          }
          
          try {
              $pd = Get-PhysicalDisk -ErrorAction Stop | Select-Object -First 1
              $mediaType = $pd.MediaType
              if ($mediaType -eq 'Unspecified' -or $mediaType -eq 'Unknown' -or -not $mediaType) {
                  if ($pd.FriendlyName -match 'SSD|Solid State') { $mediaType = 'SSD' }
                  elseif ($pd.FriendlyName -match 'HDD|Hard Disk') { $mediaType = 'HDD' }
                  elseif ($pd.FriendlyName -match 'Virtual Disk') { $mediaType = 'Virtual (Cloud SSD)' }
                  else { $mediaType = 'Unknown' }
              }
              Write-Host "Fiziksel Disk Tipi  : $mediaType ($($pd.BusType))"
          } catch {
              Write-Host "Fiziksel Disk Tipi  : Virtual (Cloud SSD)"
          }

          Write-Host "`n--- AG VE EKRAN KARTI ---" -ForegroundColor Yellow
          $gpus = Get-CimInstance Win32_VideoController
          foreach ($gpu in $gpus) {
              Write-Host "Ekran Karti         : $($gpu.Name) | Cozunurluk: $($gpu.CurrentHorizontalResolution)x$($gpu.CurrentVerticalResolution)"
          }
          
          $ips = Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.*' }
          foreach ($ip in $ips) {
              Write-Host "Ag IP Adresi        : $($ip.IPAddress) ($($ip.InterfaceAlias))"
          }
          Write-Host "============================================================" -ForegroundColor Cyan

      - name: Install Tailscale
        run: |
          $ErrorActionPreference = 'Continue'
          $tsUrls = @("https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi")
          $installerPath = "$env:TEMP\tailscale.msi"
          $downloaded = $false
          foreach ($url in $tsUrls) {
              try {
                  Invoke-WebRequest -Uri $url -OutFile $installerPath -UseBasicParsing -ErrorAction Stop
                  if ((Test-Path $installerPath) -and ((Get-Item $installerPath).Length -gt 5MB)) { $downloaded = $true; break }
              } catch {}
          }
          if (-not $downloaded) { Write-Error "Tailscale download failed"; exit 1 }
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $r = 0; while (-not (Test-Path $tsExe) -and $r -lt 30) { Start-Sleep 2; $r++ }
          if (-not (Test-Path $tsExe)) { Write-Error "Tailscale install failed"; exit 1 }
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

      - name: Establish Tailscale Connection
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null; $r = 0
          while (-not $tsIP -and $r -lt 10) { $tsIP = & $tsExe ip -4; Start-Sleep 5; $r++ }
          if (-not $tsIP) { Write-Error "No Tailscale IP"; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          $password = "Password!?"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "ERROR-4004" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "ERROR-4004"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "ERROR-4004"
          echo "RDP_CREDS=User: ERROR-4004 | Password: $password" >> $env:GITHUB_ENV
          if (-not (Get-LocalUser -Name "ERROR-4004")) { Write-Error "User creation failed"; exit 1 }

      - name: ULTRA FAST CLEANUP
