          exit 0

      - name: Verify RDP Accessibility
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $tsIP = & $tsExe ip -4
          if (-not $tsIP) { Write-Error "Tailscale IP missing"; exit 1 }
          $r = Test-NetConnection -ComputerName $tsIP -Port 3389
          if (-not $r.TcpTestSucceeded) { Write-Error "RDP port unreachable"; exit 1 }

      - name: Maintain Connection
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $tsIP = & $tsExe ip -4
          Write-Host "Address: $tsIP"
          Write-Host "Username: ERROR-4004"
          Write-Host "Password: Password!?"
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
