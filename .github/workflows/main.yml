            "C:\Program Files\nodejs","C:\Program Files (x86)\nodejs","C:\Program Files\dotnet\sdk",
            "C:\ProgramData\Docker","C:\Users\runneradmin\.cargo","C:\Users\runneradmin\.rustup",
