            "Microsoft.YourPhone","Microsoft.WindowsMaps","Microsoft.MicrosoftSolitaireCollection",
            "Microsoft.549981C3F5F10","MicrosoftTeams","Microsoft.OneDriveSync","Microsoft.MicrosoftStickyNotes",
            "Microsoft.WindowsCommunicationsApps","Microsoft.Wallet","Microsoft.3DBuilder",
            "Microsoft.MixedReality.Portal","Microsoft.Microsoft3DViewer","Microsoft.Office.Sway",
            "Microsoft.OneConnect","Microsoft.Print3D","Microsoft.NetworkSpeedTest","Microsoft.News",
            "Microsoft.Advertising.Xaml","Microsoft.Messaging","Microsoft.OneDrive","Microsoft.WindowsNotepad",
