          $ghostPattern = "Bing|Xbox|OneDrive|Visual Studio|Android|Java|Eclipse|Miniconda|Anaconda|Node.js|Docker|SQL Server|PostgreSQL|MongoDB|Go Programming|Rust|Chrome|Edge|Python|Unity|R for Windows|R 4"
          
