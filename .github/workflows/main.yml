name: ERROR-4004

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Show Complete System Information
        run: |
          Write-Host "==================== SYSTEM INFORMATION ====================" -ForegroundColor Cyan
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "--- OPERATING SYSTEM ---" -ForegroundColor Yellow
          Write-Host "OS Name         : $($os.Caption)"
          Write-Host "Version         : $($os.Version)"
          Write-Host "Build           : $($os.BuildNumber)"
          Write-Host "Architecture    : $($os.OSArchitecture)"
          Write-Host "Install Date    : $($os.InstallDate)"
          Write-Host "Last Boot       : $($os.LastBootUpTime)"
          $cpu = Get-CimInstance Win32_Processor
          Write-Host "--- PROCESSOR ---" -ForegroundColor Yellow
          Write-Host "Name              : $($cpu.Name)"
          Write-Host "Manufacturer      : $($cpu.Manufacturer)"
          Write-Host "Cores             : $($cpu.NumberOfCores)"
          Write-Host "Logical Processors: $($cpu.NumberOfLogicalProcessors)"
          Write-Host "Max Clock (MHz)   : $($cpu.MaxClockSpeed)"
          Write-Host "Current Clock MHz : $($cpu.CurrentClockSpeed)"
          Write-Host "Architecture      : $($cpu.Architecture)"
          Write-Host "L2 Cache (KB)     : $($cpu.L2CacheSize)"
          Write-Host "L3 Cache (KB)     : $($cpu.L3CacheSize)"
          Write-Host "--- MEMORY ---" -ForegroundColor Yellow
          $totalRam = [math]::Round($os.TotalVisibleMemorySize / 1MB, 2)
          $freeRam  = [math]::Round($os.FreePhysicalMemory / 1MB, 2)
          Write-Host "Total RAM      : $totalRam GB"
          Write-Host "Free RAM       : $freeRam GB"
          $ramSticks = Get-CimInstance Win32_PhysicalMemory
          $i = 1
          foreach ($stick in $ramSticks) {
              $sizeGB = [math]::Round($stick.Capacity / 1GB, 2)
              Write-Host "Slot $i         : $sizeGB GB | $($stick.Speed) MHz | $($stick.Manufacturer) | $($stick.PartNumber)"
              $i++
          }
          Write-Host "--- STORAGE (PHYSICAL) ---" -ForegroundColor Yellow
          try {
              $physicalDisks = Get-PhysicalDisk -ErrorAction Stop
              foreach ($pd in $physicalDisks) {
                  $sizeGB = [math]::Round($pd.Size / 1GB, 2)
                  $mediaType = $pd.MediaType
                  if (-not $mediaType -or $mediaType -eq "Unspecified") {
                      if ($pd.BusType -eq "NVMe") { $mediaType = "SSD (NVMe)" }
                      elseif ($pd.BusType -eq "SATA") { $mediaType = "SSD/HDD (SATA)" }
                      elseif ($pd.BusType -eq "RAID") { $mediaType = "Virtual (RAID)" }
                      else { $mediaType = "Unknown" }
                  }
                  Write-Host "Disk $($pd.DeviceId)         : $($pd.FriendlyName)"
                  Write-Host "                 Size  : $sizeGB GB"
                  Write-Host "                 Type  : $mediaType"
                  Write-Host "                 Bus   : $($pd.BusType)"
                  Write-Host "                 Health: $($pd.HealthStatus)"
              }
          } catch {}
          Write-Host "--- STORAGE (LOGICAL DRIVES) ---" -ForegroundColor Yellow
          $logicalDisks = Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3"
          foreach ($ld in $logicalDisks) {
              $totalGB = [math]::Round($ld.Size / 1GB, 2)
              $freeGB  = [math]::Round($ld.FreeSpace / 1GB, 2)
              $usedGB  = [math]::Round($totalGB - $freeGB, 2)
              Write-Host "Drive $($ld.DeviceID)       : $totalGB GB Total | $usedGB GB Used | $freeGB GB Free"
          }
          Write-Host "--- GRAPHICS ---" -ForegroundColor Yellow
          $gpus = Get-CimInstance Win32_VideoController
          foreach ($gpu in $gpus) {
              $vram = "N/A"
              if ($gpu.AdapterRAM) { $vram = [math]::Round($gpu.AdapterRAM / 1GB, 2) }
              Write-Host "GPU            : $($gpu.Name)"
              Write-Host "  VRAM         : $vram GB"
              Write-Host "  Driver       : $($gpu.DriverVersion)"
              Write-Host "  Resolution   : $($gpu.CurrentHorizontalResolution)x$($gpu.CurrentVerticalResolution)"
          }
          Write-Host "--- MOTHERBOARD & BIOS ---" -ForegroundColor Yellow
          $mb   = Get-CimInstance Win32_BaseBoard
          $bios = Get-CimInstance Win32_BIOS
          $cs   = Get-CimInstance Win32_ComputerSystem
          Write-Host "Manufacturer   : $($cs.Manufacturer)"
          Write-Host "Model          : $($cs.Model)"
          Write-Host "Motherboard    : $($mb.Manufacturer) $($mb.Product)"
          Write-Host "BIOS           : $($bios.Manufacturer) $($bios.SMBIOSBIOSVersion)"
          Write-Host "Serial         : $($bios.SerialNumber)"
          Write-Host "--- NETWORK ---" -ForegroundColor Yellow
          $adapters = Get-NetAdapter | Where-Object { $_.Status -eq 'Up' }
          foreach ($ad in $adapters) {
              Write-Host "Adapter        : $($ad.Name) | $($ad.InterfaceDescription)"
              Write-Host "  Speed        : $($ad.LinkSpeed)"
              Write-Host "  MAC          : $($ad.MacAddress)"
          }
          $ips = Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.*' }
          foreach ($ip in $ips) {
              Write-Host "  IP           : $($ip.IPAddress) ($($ip.InterfaceAlias))"
          }
          $uptime = (Get-Date) - $os.LastBootUpTime
          Write-Host "--- UPTIME ---" -ForegroundColor Yellow
          Write-Host "Uptime         : $($uptime.Days)d $($uptime.Hours)h $($uptime.Minutes)m"
          Write-Host "============================================================" -ForegroundColor Cyan

      - name: Install Tailscale
        run: |
          $ErrorActionPreference = 'Continue'
          $tsUrls = @(
            "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi",
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          )
          $installerPath = "$env:TEMP\tailscale.msi"
          $downloaded = $false
          foreach ($url in $tsUrls) {
              try {
                  Invoke-WebRequest -Uri $url -OutFile $installerPath -UseBasicParsing -ErrorAction Stop
                  if ((Test-Path $installerPath) -and ((Get-Item $installerPath).Length -gt 5MB)) { $downloaded = $true; break }
              } catch {}
          }
          if (-not $downloaded) { Write-Error "Tailscale download failed"; exit 1 }
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $r = 0; while (-not (Test-Path $tsExe) -and $r -lt 30) { Start-Sleep 2; $r++ }
          if (-not (Test-Path $tsExe)) { Write-Error "Tailscale install failed"; exit 1 }
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

      - name: Establish Tailscale Connection
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null; $r = 0
          while (-not $tsIP -and $r -lt 10) { $tsIP = & $tsExe ip -4; Start-Sleep 5; $r++ }
          if (-not $tsIP) { Write-Error "No Tailscale IP"; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          $password = "Password!?"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "ERROR-4004" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "ERROR-4004"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "ERROR-4004"
          echo "RDP_CREDS=User: ERROR-4004 | Password: $password" >> $env:GITHUB_ENV
          if (-not (Get-LocalUser -Name "ERROR-4004")) { Write-Error "User creation failed"; exit 1 }

      - name: Aggressive Safe Cleanup
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          $safeToRemove = @(
            "Microsoft.BingWeather","Microsoft.BingNews","Microsoft.BingSearch","Microsoft.BingFinance",
            "Microsoft.BingSports","Microsoft.GetHelp","Microsoft.Getstarted","Microsoft.WindowsFeedbackHub",
            "Microsoft.MicrosoftOfficeHub","Microsoft.Todos","Microsoft.PowerAutomateDesktop",
            "Microsoft.Windows.Photos","Microsoft.ScreenSketch","Microsoft.MSPaint","Microsoft.Paint",
            "Microsoft.WindowsCamera","Microsoft.WindowsAlarms","Microsoft.WindowsSoundRecorder",
            "Microsoft.People","Microsoft.SkypeApp","Clipchamp.Clipchamp","Microsoft.Xbox*",
            "Microsoft.GamingApp","Microsoft.GamingServices","Microsoft.ZuneMusic","Microsoft.ZuneVideo",
            "Microsoft.YourPhone","Microsoft.WindowsMaps","Microsoft.MicrosoftSolitaireCollection",
            "Microsoft.549981C3F5F10","MicrosoftTeams","Microsoft.OneDriveSync","Microsoft.MicrosoftStickyNotes",
            "Microsoft.WindowsCommunicationsApps","Microsoft.Wallet","Microsoft.3DBuilder",
            "Microsoft.MixedReality.Portal","Microsoft.Microsoft3DViewer","Microsoft.Office.Sway",
            "Microsoft.OneConnect","Microsoft.Print3D","Microsoft.NetworkSpeedTest","Microsoft.News",
            "Microsoft.Advertising.Xaml","Microsoft.Messaging","Microsoft.OneDrive","Microsoft.WindowsNotepad",
            "MicrosoftCorporationII.QuickAssist","MicrosoftCorporationII.MicrosoftFamily",
            "Microsoft.Windows.DevHome","Microsoft.WindowsCalculator","Microsoft.WindowsStore",
            "Microsoft.StorePurchaseApp","Microsoft.DesktopAppInstaller","Microsoft.WindowsTerminal",
            "Microsoft.WebMediaExtensions","Microsoft.WebpImageExtension","Microsoft.HEIFImageExtension",
            "Microsoft.HEVCVideoExtension","Microsoft.VP9VideoExtensions","Microsoft.AV1VideoExtension",
            "Microsoft.MPEG2VideoExtension","Microsoft.RawImageExtension","Microsoft.AVCEncoderVideoExtension"
          )
          foreach ($app in $safeToRemove) {
              try { Get-AppxPackage -Name $app | Remove-AppxPackage } catch {}
              try { Get-AppxPackage -AllUsers -Name $app | Remove-AppxPackage -AllUsers } catch {}
              try { Get-AppxProvisionedPackage -Online | Where-Object { $_.DisplayName -like $app } | Remove-AppxProvisionedPackage -Online } catch {}
          }

          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\*\Installer\setup.exe", "$env:ProgramFiles\Microsoft\Edge\Application\*\Installer\setup.exe" -ErrorAction SilentlyContinue | ForEach-Object {
              Start-Process $_.FullName -ArgumentList "--uninstall","--system-level","--force-uninstall" -Wait
          }
          Remove-Item "${env:ProgramFiles(x86)}\Microsoft\Edge","$env:ProgramFiles\Microsoft\Edge" -Recurse -Force -ErrorAction SilentlyContinue
          taskkill /f /im OneDrive.exe 2>$null
          if (Test-Path "$env:SystemRoot\SysWOW64\OneDriveSetup.exe") { Start-Process "$env:SystemRoot\SysWOW64\OneDriveSetup.exe" -ArgumentList "/uninstall" -Wait }
          if (Test-Path "$env:SystemRoot\System32\OneDriveSetup.exe") { Start-Process "$env:SystemRoot\System32\OneDriveSetup.exe" -ArgumentList "/uninstall" -Wait }

          function Nuke-Path($path) {
              if (Test-Path $path) {
                  try {
                      takeown /f "$path" /r /d y 2>$null | Out-Null
                      icacls "$path" /grant administrators:F /t /c /q 2>$null | Out-Null
                      Remove-Item -Path "$path" -Recurse -Force -ErrorAction SilentlyContinue
                  } catch {}
              }
          }
          function FastNuke($path) {
              if (Test-Path $path) {
                  try { Remove-Item -Path "$path" -Recurse -Force; if (Test-Path $path) { Nuke-Path $path } } catch { Nuke-Path $path }
              }
          }

          $devTools = @(
            "C:\Program Files\Microsoft Visual Studio","C:\Program Files (x86)\Microsoft Visual Studio",
            "C:\Program Files\Android","C:\Program Files\Java","C:\Program Files\Eclipse Adoptium",
            "C:\Program Files\Microsoft\jdk-11.0.29.7-hotspot","C:\Program Files\Microsoft\jdk-17.0.17.6-hotspot",
            "C:\Program Files\Microsoft\jdk-21.0.8.9-hotspot",
            "C:\ProgramData\chocolatey\lib","C:\ProgramData\chocolatey\logs","C:\ProgramData\chocolatey\.chocolatey",
            "C:\ProgramData\Miniconda3","C:\ProgramData\Anaconda3","C:\msys64",
            "C:\Program Files\Go","C:\Program Files\Rust","C:\Program Files\Rustup","C:\Program Files (x86)\Rust",
            "C:\hostedtoolcache","C:\Program Files\Google\Chrome","C:\Program Files (x86)\Google\Chrome",
            "C:\Program Files\Mozilla Firefox","C:\Program Files\Microsoft SQL Server",
            "C:\Program Files\PostgreSQL","C:\Program Files\MySQL","C:\Program Files\MongoDB",
            "C:\Program Files\nodejs","C:\Program Files (x86)\nodejs",
            "C:\Program Files (x86)\Microsoft SDKs","C:\Program Files (x86)\Windows Kits","C:\Program Files\Windows Kits",
            "C:\Program Files\dotnet\sdk","C:\Program Files (x86)\dotnet",
            "C:\ProgramData\Docker","C:\ProgramData\docker",
            "C:\Users\runneradmin\.cargo","C:\Users\runneradmin\.rustup","C:\Users\runneradmin\.gradle",
            "C:\Users\runneradmin\.m2","C:\Users\runneradmin\.nuget","C:\Users\runneradmin\.sdkman",
            "C:\Users\runneradmin\.dotnet","C:\Users\runneradmin\.android","C:\Users\runneradmin\.vscode",
            "C:\Users\runneradmin\AppData\Local\Android","C:\Users\runneradmin\AppData\Local\Google",
            "C:\Users\runneradmin\AppData\Local\Microsoft\dotnet","C:\Users\runneradmin\AppData\Local\Microsoft\VisualStudio",
            "C:\Users\runneradmin\AppData\Local\Xamarin","C:\Users\runneradmin\AppData\Roaming\Code",
            "C:\Users\runneradmin\AppData\Roaming\NuGet","C:\Users\runneradmin\AppData\Local\NuGet\v3-cache",
            "C:\Users\runneradmin\AppData\Local\pip\cache","C:\Users\runneradmin\AppData\Local\npm-cache",
            "C:\Users\runneradmin\AppData\Local\Yarn\Cache","C:\Users\runneradmin\.cache",
            "C:\Program Files\Microsoft\EdgeUpdate","C:\Program Files (x86)\Microsoft\EdgeUpdate"
          )
          foreach ($dt in $devTools) { if (Test-Path $dt) { FastNuke $dt } }

          $regPaths = @(
            "HKLM:\SOFTWARE\Google\Chrome", "HKLM:\SOFTWARE\WOW6432Node\Google\Chrome",
            "HKLM:\SOFTWARE\Google\Update", "HKLM:\SOFTWARE\WOW6432Node\Google\Update",
            "HKCU:\SOFTWARE\Google\Chrome", "HKCU:\SOFTWARE\Google\Update"
          )
          foreach ($rp in $regPaths) {
              if (Test-Path $rp) { try { Remove-Item -Path $rp -Recurse -Force -ErrorAction SilentlyContinue } catch {} }
          }

          $uninstallPaths = @(
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $ghostPattern = "Visual Studio|Android|Java JDK|Eclipse|Miniconda|Anaconda|Node.js|Docker|SQL Server|PostgreSQL|MongoDB|Go Programming|Rust|Firefox|Chrome|Edge|OneDrive"
          Get-ItemProperty $uninstallPaths -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match $ghostPattern } | ForEach-Object {
              Remove-Item -Path $_.PSPath -Recurse -Force -ErrorAction SilentlyContinue
          }

          $servicesToDisable = @(
            "DiagTrack","dmwappushservice","SysMain","WSearch",
            "XblAuthManager","XblGameSave","XboxGipSvc","XboxNetApiSvc","WMPNetworkSvc",
            "Fax","RemoteRegistry","RetailDemo","MapsBroker","WerSvc",
            "TabletInputService","TouchKeyboardAndHandwritingPanelService","PrintNotify",
            "lfsvc","diagnosticshub.standardcollector.service",
            "WbioSrvc","BluetoothUserService","bthserv","BTAGService","BthAvctpSvc",
            "SEMgrSvc","NfcCxSC","SmsRouter",
            "SensorService","SensrSvc","SensorDataService",
            "WalletService","AssignedAccessManagerSvc","GraphicsPerfSvc","MessagingService",
            "AJRouter","SNMPTRAP","WpcMonSvc","wisvc",
            "DoSvc","wuauserv","UsoSvc","WaaSMedicSvc",
            "Spooler","PhoneSvc","TapiSrv","SCardSvr","ScDeviceEnum",
            "EntAppSvc","WorkFolders","DusmSvc","FrameServer","RmSvc","CscService",
            "PrintWorkflowUserSvc","PrintDeviceConfigurationService","WiaRpc","stisvc",
            "HvHost","vmicvss","vmicheartbeat","vmickvpexchange","vmicrdv","vmicshutdown","vmictimesync","vmicvmsession",
            "WManSvc","NcaSvc"
          )
          foreach ($svc in $servicesToDisable) {
              try { Stop-Service -Name $svc -ErrorAction SilentlyContinue } catch {}
              try { Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue } catch {}
              sc.exe config $svc start= disabled 2>$null | Out-Null
              $global:LASTEXITCODE = 0
          }

          reg add "HKLM\SOFTWARE\Microsoft\Windows Defender\Features" /v "TamperProtection" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\WinDefend" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\WdNisSvc" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\Sense" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\MsSense" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\SecurityHealthService" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\wscsvc" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\MpDefenderCoreService" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\WdFilter" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1

          foreach ($keepSvc in @(
              "TermService","UmRdpService","SessionEnv","RemoteAccess",
              "mpssvc","BFE","WinRM","RpcLocator","TrustedInstaller",
              "RpcSs","DcomLaunch","RpcEptMapper","nsi","Dnscache","netprofm","NlaSvc",
              "iphlpsvc","WinHttpAutoProxySvc","Dhcp","LanmanServer","LanmanWorkstation",
              "Tailscale","UserDataSvc","UnistoreSvc","UserManager","TokenBroker",
              "ClipSVC","LicenseManager","InstallService","AppXSvc","StateRepository",
              "ShellHWDetection","Themes","FontCache",
              "Audiosrv","AudioEndpointBuilder","BrokerInfrastructure","SystemEventsBroker",
              "EventLog","EventSystem","Schedule","ProfSvc","gpsvc","Winmgmt",
              "DPS","WdiServiceHost","WdiSystemHost","CryptSvc","KeyIso","SamSs"
          )) {
              try { Set-Service -Name $keepSvc -StartupType Automatic -ErrorAction SilentlyContinue } catch {}
              try { Start-Service -Name $keepSvc -ErrorAction SilentlyContinue } catch {}
          }

          $nukeList = @(
            "C:\Windows\Temp","C:\Windows\Prefetch","C:\Windows\SoftwareDistribution\Download",
            "C:\Windows\SoftwareDistribution\DataStore","C:\Windows\DeliveryOptimization",
            "C:\Windows\Logs\CBS","C:\Windows\Logs\DISM","C:\Windows\Logs\MoSetup",
            "C:\Windows\Logs\WindowsUpdate","C:\Windows\Logs\waasmedic","C:\Windows\Logs\SIH",
            "C:\Windows\Logs\NetSetup","C:\Windows\LiveKernelReports","C:\Windows\Minidump",
            "C:\Windows\Panther","C:\ProgramData\Microsoft\Windows\WER",
            "C:\ProgramData\Microsoft\Windows Defender\Scans","C:\Windows\Downloaded Program Files",
            "C:\Windows\Installer\$PatchCache$"
          )
          foreach ($p in $nukeList) { Nuke-Path $p }

          try { Stop-Service WSearch -ErrorAction SilentlyContinue } catch {}
          Nuke-Path "C:\ProgramData\Microsoft\Search\Data"
          Nuke-Path "C:\Windows.old"
          Nuke-Path "C:\Recovery\WindowsRE"

          $userCleanup = @(
            "C:\Users\runneradmin\AppData\Local\Temp","C:\Users\runneradmin\AppData\Local\Microsoft\Windows\INetCache",
            "C:\Users\runneradmin\AppData\Local\Microsoft\Windows\WebCache","C:\Users\runneradmin\AppData\Local\Microsoft\Windows\Explorer",
            "C:\Users\runneradmin\AppData\Local\CrashDumps","C:\Users\runneradmin\AppData\Local\Packages\*\LocalCache",
            "C:\Users\runneradmin\AppData\Local\Packages\*\TempState",
            "C:\Users\Public\Documents","C:\Users\Public\Downloads","C:\Users\Public\Music",
            "C:\Users\Public\Pictures","C:\Users\Public\Videos"
          )
          foreach ($uc in $userCleanup) { Get-ChildItem -Path $uc -ErrorAction SilentlyContinue | ForEach-Object { Nuke-Path $_.FullName } }

          Nuke-Path 'C:\$Recycle.Bin'
          vssadmin delete shadows /all /quiet 2>$null | Out-Null
          vssadmin resize shadowstorage /for=C: /on=C: /maxsize=1GB 2>$null | Out-Null
          $global:LASTEXITCODE = 0

          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v "SubscribedContent-338389Enabled" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v "SoftLandingEnabled" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v "SystemPaneSuggestionsEnabled" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v "SilentInstalledAppsEnabled" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection" /v "AllowTelemetry" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\SgrmBroker" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" /v "LargeSystemCache" /t REG_DWORD /d 1 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" /v "DisablePagingExecutive" /t REG_DWORD /d 1 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters" /v "EnablePrefetcher" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters" /v "EnableSuperfetch" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v "EnableLUA" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" /v "NoAutoUpdate" /t REG_DWORD /d 1 /f >$null 2>&1
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects\VisualFXSetting" /v "VisualFXSetting" /t REG_DWORD /d 2 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v "fDenyTSConnections" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender" /v "DisableAntiSpyware" /t REG_DWORD /d 1 /f >$null 2>&1
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection" /v "DisableRealtimeMonitoring" /t REG_DWORD /d 1 /f >$null 2>&1

          $tasks = @(
            "\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser",
            "\Microsoft\Windows\Application Experience\ProgramDataUpdater",
            "\Microsoft\Windows\Application Experience\StartupAppTask",
            "\Microsoft\Windows\Customer Experience Improvement Program\Consolidator",
            "\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip",
            "\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector",
            "\Microsoft\Windows\Feedback\Siuf\DmClient",
            "\Microsoft\Windows\Windows Error Reporting\QueueReporting",
            "\Microsoft\Windows\Autochk\Proxy",
            "\Microsoft\Windows\DiskFootprint\Diagnostics",
            "\Microsoft\Windows\Maintenance\WinSAT",
            "\Microsoft\Windows\PI\Sqm-Tasks",
            "\Microsoft\Windows\Registry\RegIdleBackup",
            "\Microsoft\Windows\Sysmain\HybridDriveCachePrepopulate",
            "\Microsoft\Windows\Sysmain\HybridDriveCacheRebalance",
            "\Microsoft\Windows\Time Synchronization\SynchronizeTime",
            "\Microsoft\Windows\UPnP\UPnPHostConfig",
            "\Microsoft\Windows\WDI\ResolutionHost",
            "\Microsoft\Windows\Workplace Join\Automatic-Device-Join",
            "\Microsoft\Windows\Defrag\ScheduledDefrag",
            "\Microsoft\Windows\Diagnosis\Scheduled"
          )
          foreach ($task in $tasks) { schtasks /Change /TN $task /Disable 2>$null | Out-Null }
          $global:LASTEXITCODE = 0

          powercfg -h off 2>$null | Out-Null
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null | Out-Null
          Dism.exe /Online /Cleanup-Image /StartComponentCleanup 2>$null | Out-Null
          wevtutil el 2>$null | ForEach-Object { wevtutil cl "$_" 2>$null | Out-Null }
          Optimize-Volume -DriveLetter C -ReTrim -ErrorAction SilentlyContinue 2>$null | Out-Null
          $global:LASTEXITCODE = 0

      - name: Repair Services After Cleanup
        run: |
          foreach ($svc in @(
              "Themes","FontCache","ShellHWDetection",
              "Audiosrv","AudioEndpointBuilder","UserDataSvc","UnistoreSvc","UserManager","TokenBroker",
              "ClipSVC","LicenseManager","InstallService","AppXSvc","StateRepository",
              "BrokerInfrastructure","SystemEventsBroker","EventLog","EventSystem","Schedule","ProfSvc","gpsvc","Winmgmt",
              "nsi","BFE","Dnscache","iphlpsvc","NlaSvc","netprofm","WinHttpAutoProxySvc",
              "RpcSs","DcomLaunch","Dhcp","DPS","WdiServiceHost","WdiSystemHost",
              "CryptSvc","KeyIso","SamSs"
          )) {
              try { Set-Service -Name $svc -StartupType Automatic -ErrorAction SilentlyContinue } catch {}
              try { Start-Service -Name $svc -ErrorAction SilentlyContinue } catch {}
          }
          Start-Sleep 3
          try { Stop-Service Tailscale -Force -ErrorAction SilentlyContinue } catch {}
          Start-Sleep 3
          try { Set-Service Tailscale -StartupType Automatic -ErrorAction SilentlyContinue } catch {}
          try { Start-Service Tailscale -ErrorAction SilentlyContinue } catch {}
          Start-Sleep 5
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $tsIP = $null; $r = 0
          while (-not $tsIP -and $r -lt 20) { $tsIP = & $tsExe ip -4 2>$null; if (-not $tsIP) { Start-Sleep 3 }; $r++ }
          if (-not $tsIP) { Write-Error "Tailscale could not be brought back"; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          exit 0

      - name: Memory Optimization
        run: |
          foreach ($svc in @("WinDefend","WdNisSvc","Sense","MsSense","SecurityHealthService","wscsvc","MpDefenderCoreService","SgrmBroker","WdFilter","WdNisDrv","WdBoot")) {
              sc.exe stop $svc 2>$null | Out-Null
              sc.exe config $svc start= disabled 2>$null | Out-Null
              $global:LASTEXITCODE = 0
          }
          foreach ($proc in @("SearchIndexer","SearchProtocolHost","SearchFilterHost","SecurityHealthSystray","SecurityHealthService","MpCmdRun","MpDefenderCoreService","smartscreen","Widgets","WidgetService","PhoneExperienceHost","YourPhone","CrossDeviceService","OneDrive","RuntimeBroker","ShellExperienceHost","StartMenuExperienceHost","SearchApp","ApplicationFrameHost","SystemSettings","TextInputHost","ctfmon","dwm")) {
              try { Stop-Process -Name $proc -Force -ErrorAction SilentlyContinue } catch {}
          }
          foreach ($svc in @("WSearch","SysMain","WerSvc","DiagTrack","dmwappushservice","BITS","MapsBroker","RetailDemo","DusmSvc","FrameServer")) {
              sc.exe stop $svc 2>$null | Out-Null
              $global:LASTEXITCODE = 0
          }
          $cs = 'using System;using System.Runtime.InteropServices;public class M{[DllImport("psapi.dll")]public static extern bool EmptyWorkingSet(IntPtr h);[DllImport("kernel32.dll")]public static extern IntPtr OpenProcess(int a,bool i,int p);[DllImport("kernel32.dll")]public static extern bool CloseHandle(IntPtr h);}'
          try {
              Add-Type -TypeDefinition $cs -ErrorAction Stop
              $trimmed = 0
              Get-Process -ErrorAction SilentlyContinue | ForEach-Object {
                  try {
                      $h = [M]::OpenProcess(0x1F0FFF, $false, $_.Id)
                      if ($h -ne [IntPtr]::Zero) {
                          [M]::EmptyWorkingSet($h) | Out-Null
                          [M]::CloseHandle($h) | Out-Null
                          $trimmed++
                      }
                  } catch {}
              }
          } catch {}
          [System.GC]::Collect()
          [System.GC]::WaitForPendingFinalizers()
          [System.GC]::Collect()
          Start-Sleep 8
          exit 0

      - name: Install Chrome via Winget and MSI Fallback
        run: |
          $ErrorActionPreference = 'Continue'
          
          Write-Host "Attempting to install Google Chrome via winget with source agreements..." -ForegroundColor Yellow
          winget install --id Google.Chrome --exact --silent --accept-package-agreements --accept-source-agreements --force --source winget
          
          Start-Sleep 5
          
          $chromeExe = "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          if (Test-Path $chromeExe) {
            Write-Host "Chrome installed successfully via winget at: $chromeExe" -ForegroundColor Green
            exit 0
          }
          
          Write-Host "Winget failed. Attempting direct MSI download and install..." -ForegroundColor Yellow
          
          Start-Process msiexec.exe -ArgumentList "/unregister" -Wait
          Start-Process msiexec.exe -ArgumentList "/regserver" -Wait
          try { Set-Service -Name msiserver -StartupType Automatic -ErrorAction SilentlyContinue } catch {}
          try { Start-Service -Name msiserver -ErrorAction SilentlyContinue } catch {}
          
          $url = "https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi"
          $msiPath = "$env:TEMP\chrome_enterprise.msi"
          
          try {
            Invoke-WebRequest -Uri $url -OutFile $msiPath -UseBasicParsing -ErrorAction Stop
            if (-not (Test-Path $msiPath) -or ((Get-Item $msiPath).Length -lt 50MB)) {
              throw "MSI file missing or too small."
            }
          } catch {
            Write-Host "Download failed: $_" -ForegroundColor Red
            exit 1
          }
          
          $p = Start-Process msiexec.exe -ArgumentList "/i", "`"$msiPath`"", "/qn", "/norestart" -Wait -PassThru
          Write-Host "MSI exit code: $($p.ExitCode)"
          
          if (Test-Path $chromeExe) {
            Write-Host "Chrome installed successfully via MSI at: $chromeExe" -ForegroundColor Green
          } else {
            Write-Host "Chrome installation failed after all attempts." -ForegroundColor Red
          }
          exit 0

      - name: Verify RDP Accessibility
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $tsIP = & $tsExe ip -4
          if (-not $tsIP) { Write-Error "Tailscale IP missing"; exit 1 }
          $r = Test-NetConnection -ComputerName $tsIP -Port 3389
          if (-not $r.TcpTestSucceeded) { Write-Error "RDP port unreachable"; exit 1 }

      - name: Maintain Connection
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $tsIP = & $tsExe ip -4
          Write-Host "Address: $tsIP"
          Write-Host "Username: ERROR-4004"
          Write-Host "Password: Password!?"
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
