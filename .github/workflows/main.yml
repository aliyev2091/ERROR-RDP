name: ERROR-4004

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Hardcore Performance Optimization and Deep Cleanup
        run: |
          Write-Host "Initiating aggressive cleanup. Protecting RDP and Network configurations..."
          
          # 1. Remove heavy developer tools and directories to save ~40GB space
          if (Test-Path "C:\Program Files\Microsoft Visual Studio") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Program Files\Microsoft Visual Studio" }
          if (Test-Path "C:\Program Files (x86)\Microsoft Visual Studio") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Program Files (x86)\Microsoft Visual Studio" }
          if (Test-Path "C:\Program Files\Microsoft SQL Server") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Program Files\Microsoft SQL Server" }
          if (Test-Path "C:\Program Files (x86)\Microsoft SQL Server") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Program Files (x86)\Microsoft SQL Server" }
          if (Test-Path "C:\Program Files\dotnet") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Program Files\dotnet" }
          if (Test-Path "C:\Program Files (x86)\Microsoft SDKs") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Program Files (x86)\Microsoft SDKs" }
          if (Test-Path "C:\android") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\android" }
          if (Test-Path "C:\Selenium") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Selenium" }
          if (Test-Path "C:\HostedToolcache") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\HostedToolcache" }
          if (Test-Path "C:\hostedtoolcache") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\hostedtoolcache" }
          if (Test-Path "C:\Program Files\Java") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Program Files\Java" }
          if (Test-Path "C:\Program Files\Go") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Program Files\Go" }
          if (Test-Path "C:\tools\php") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\tools\php" }
          if (Test-Path "C:\tools\pypy") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\tools\pypy" }

          # 2. Purge system caches using native DISM tool and clear temp folders
          Write-Host "Purging system caches and temporary directories..."
          Dism.exe /online /Cleanup-Image /StartComponentCleanup /ResetBase
          Get-ChildItem -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Aggressive cleanup accomplished! System is fully optimized for pure RDP performance."

      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # For testing, allow any incoming connection on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # (Optional) Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          # Native Windows CMD command that never fails with special characters
          net user ERROR-4004 Password!? /add /y
          net localgroup Administrators ERROR-4004 /add
          net localgroup "Remote Desktop Users" ERROR-4004 /add

      - name: Install Tailscale
        run: |
          \$tsUrl = "https://tailscale.com"
          installerPath = "env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri tsUrl -OutFile installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item \$installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "\$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=\({{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-\)env:GITHUB_RUN_ID

          # Wait for Tailscale to assign an IP
          \$tsIP = \(null\)retries = 0
          while (-not tsIP -and retries -lt 10) {
              \(tsIP = & "\)env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              \$retries++
          }

          if (-not \$tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=tsIP" >> env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: \$env:TAILSCALE_IP"

          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          testResult = Test-NetConnection -ComputerName env:TAILSCALE_IP -Port 3389
          if (-not \$testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: ERROR-4004"
          Write-Host "Password: Password!?"
          Write-Host "==================`n"

          # Keep runner active indefinitely (or until manually cancelled)
          while (\$true) {
              Write-Host "[\$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
          
