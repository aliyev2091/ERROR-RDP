name: ERROR-4004

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 3600 # 60 saat
    
    steps:
      - name: Tailscale'i Başlat
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Kullanıcı Oluştur, Full Admin Yap ve RDP'yi Etkinleştir
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          $Password = ConvertTo-SecureString -AsPlainText "${{ secrets.ERROR_4004_PASSWORD }}" -Force
          if (-not (Get-LocalUser -Name "ERROR-4004" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "ERROR-4004" -Password $Password -PasswordNeverExpires -AccountNeverExpires
          } else {
            Set-LocalUser -Name "ERROR-4004" -Password $Password
          }
          Add-LocalGroupMember -Group "Administrators" -Member "ERROR-4004" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "ERROR-4004" -ErrorAction SilentlyContinue
          
          # UAC'ı (Kullanıcı Hesabı Denetimi) Tamamen Kapat - FULL ADMIN YETKİSİ
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "EnableLUA" -Value 0 -Type DWord -Force
          exit 0

      - name: Firefox'u Kur ve Masaüstüne Kısayol At (Garantili)
        run: |
          $firefoxUrl = "https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US"
          Invoke-WebRequest -Uri $firefoxUrl -OutFile "$env:TEMP\firefox_installer.exe"
          Start-Process -FilePath "$env:TEMP\firefox_installer.exe" -ArgumentList "/S" -Wait
          
          # Masaüstü kısayolunu oluştur (Hem Public hem kullanıcı masaüstüne atıyoruz)
          $WshShell = New-Object -ComObject WScript.Shell
          
          # Public Masaüstü
          $Shortcut1 = $WshShell.CreateShortcut("C:\Users\Public\Desktop\Firefox.lnk")
          $Shortcut1.TargetPath = "C:\Program Files\Mozilla Firefox\firefox.exe"
          $Shortcut1.Save()
          
          # Kullanıcı Masaüstü (Direkt ERROR-4004'ün masaüstü)
          New-Item -ItemType Directory -Force -Path "C:\Users\ERROR-4004\Desktop" | Out-Null
          $Shortcut2 = $WshShell.CreateShortcut("C:\Users\ERROR-4004\Desktop\Firefox.lnk")
          $Shortcut2.TargetPath = "C:\Program Files\Mozilla Firefox\firefox.exe"
          $Shortcut2.Save()
          exit 0

      - name: SİSTEMİ SOYMA (Devasa Yer Açma ve Uygulama Silme)
        run: |
          # 1. Masaüstünü Temizle (Sadece Edge, Chrome gibi kısayollar gitsin)
          Remove-Item -Path "C:\Users\runneradmin\Desktop\*" -Recurse -Force -ErrorAction SilentlyContinue
          
          # 2. GitHub'ın Devasa Araç Kütüphanesini Sil (Python, Java, Ruby, Node vs.)
          Remove-Item -Path "C:\hostedtoolcache\*" -Recurse -Force -ErrorAction SilentlyContinue
          
          # 3. Visual Studio, Android SDK, Dotnet, Java Gibi Ağır Uygulamaları Sil
          Remove-Item -Path "C:\Program Files\Microsoft Visual Studio\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files (x86)\Microsoft Visual Studio\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\Android\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\dotnet\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\Java\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\nodejs\*" -Recurse -Force -ErrorAction SilentlyContinue
          
          # 4. Chocolatey (Paket Yöneticisi) Önbelleklerini Temizle
          Remove-Item -Path "C:\ProgramData\chocolatey\lib\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\ProgramData\chocolatey\logs\*" -Recurse -Force -ErrorAction SilentlyContinue
          
          # 5. Google Chrome ve Microsoft Edge'i Zorla Kaldır
          Remove-Item -Path "C:\Program Files\Google\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files (x86)\Microsoft\Edge\*" -Recurse -Force -ErrorAction SilentlyContinue
          
          # 6. Windows Mağaza Uygulamalarını Söküp At
          Get-AppxPackage -AllUsers | Remove-AppxPackage -ErrorAction SilentlyContinue
          
          # 7. Hazırda Bekletmeyi Kapat ve Gölge Kopyaları Sil
          powercfg -h off
          vssadmin delete shadows /all /quiet
          
          # 8. Tüm Geçici (Temp) ve Windows Güncelleme Çöplerini Sil
          Remove-Item -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\SoftwareDistribution\Download\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\Prefetch\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\Installer\*" -Recurse -Force -ErrorAction SilentlyContinue

          # 9. Defender'ı Kapat
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableIOAVProtection $true -ErrorAction SilentlyContinue
          
          exit 0

      - name: Gereksiz ve Sömüren Servisleri Kapat
        run: |
          $services = @("SysMain", "WSearch", "Spooler", "DiagTrack", "XblAuthManager", "XblGameSave", "XboxNetApiSvc", "WMPNetworkSvc", "wuauserv", "MapsBroker", "lfsvc")
          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }
          exit 0

      - name: FULL PERFORMANS (Ağ ve Arayüz)
        run: |
          powercfg -setactive e9a42b02-d5df-448d-aa00-03f14749eb61
          
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SelectTransport" -Value 2
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "InteractiveDelay" -Value 0
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "DWMFRAMEINTERVAL" -Value 15 -Type DWord -Force
          
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "Wallpaper" -Value ""
          
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces\*" -Name "TcpAckFrequency" -Value 1 -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces\*" -Name "TCPNoDelay" -Value 1 -ErrorAction SilentlyContinue
          
          ipconfig /flushdns
          exit 0

      - name: Bağlantı Bilgilerini Göster
        run: |
          Write-Host "===================================="
          Write-Host "   ERROR-4004 GOD MODE (FULL ADMIN)  "
          Write-Host "===================================="
          Write-Host "Tailscale IP:"
          tailscale ip -4
          Write-Host "Kullanici Adi : ERROR-4004"
          Write-Host "Parola        : (Secrets -> ERROR_4004_PASSWORD)"
          Write-Host "Tarayici      : Firefox (Masaüstünde Garantili)"
          Write-Host "===================================="
          exit 0
          
      - name: Sistemi 60 Saat Boyunca Açık Tut
        run: |
          Write-Host "God Mode aktif. 60 saat uyku basliyor..."
          Start-Sleep -Seconds 216000 
