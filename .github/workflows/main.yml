name: ERROR-4004

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Fast Performance Optimization and Deep Cleanup
        run: |
          Write-Host "Initiating super-fast cleanup. Protecting RDP and Network configurations..."
          
          # Remove heavy developer tools and directories (~40GB space cleared in seconds)
          if (Test-Path "C:\Program Files\Microsoft Visual Studio") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Program Files\Microsoft Visual Studio" }
          if (Test-Path "C:\Program Files (x86)\Microsoft Visual Studio") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Program Files (x86)\Microsoft Visual Studio" }
          if (Test-Path "C:\Program Files\Microsoft SQL Server") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Program Files\Microsoft SQL Server" }
          if (Test-Path "C:\Program Files (x86)\Microsoft SQL Server") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Program Files (x86)\Microsoft SQL Server" }
          if (Test-Path "C:\Program Files\dotnet") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Program Files\dotnet" }
          if (Test-Path "C:\Program Files (x86)\Microsoft SDKs") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Program Files (x86)\Microsoft SDKs" }
          if (Test-Path "C:\android") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\android" }
          if (Test-Path "C:\Selenium") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Selenium" }
          if (Test-Path "C:\HostedToolcache") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\HostedToolcache" }
          if (Test-Path "C:\hostedtoolcache") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\hostedtoolcache" }
          if (Test-Path "C:\Program Files\Java") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Program Files\Java" }
          if (Test-Path "C:\Program Files\Go") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Program Files\Go" }
          if (Test-Path "C:\tools\php") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\tools\php" }
          if (Test-Path "C:\tools\pypy") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\tools\pypy" }

          # Quickly clear temp folders
          Get-ChildItem -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Fast cleanup accomplished! System is optimized for pure RDP performance."

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          net user ERROR-4004 Password!? /add /y
          net localgroup Administrators ERROR-4004 /add
          net localgroup "Remote Desktop Users" ERROR-4004 /add
          echo "RDP_USER=ERROR-4004" >> \$env:GITHUB_ENV
          echo "RDP_PASS=Password!?" >> \$env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          \$tsUrl = "https://tailscale.com"
          \(installerPath = "\)env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri \(tsUrl -OutFile\)installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item \$installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "\(env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=\){{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-\(env:GITHUB_RUN_ID\)tsIP = \(null\)retries = 0
          while (-not \(tsIP -and\)retries -lt 10) {
              \(tsIP = & "\)env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              \$retries++
          }
          if (-not \$tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=\(tsIP" >> \)env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: \$env:TAILSCALE_IP"
          \(testResult = Test-NetConnection -ComputerName\)env:TAILSCALE_IP -Port 3389
          if (-not \$testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASS"
          Write-Host "==================`n"
          while (\$true) {
              Write-Host "[\$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
