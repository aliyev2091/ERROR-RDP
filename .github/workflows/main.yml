            "\Microsoft\Windows\Diagnosis\Scheduled"
          )
          foreach ($task in $tasksToDisable) { schtasks /Change /TN $task /Disable 2>$null | Out-Null }
          $global:LASTEXITCODE = 0

          powercfg -h off 2>$null | Out-Null
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null | Out-Null
          Dism.exe /Online /Cleanup-Image /StartComponentCleanup 2>$null | Out-Null
          wevtutil el 2>$null | ForEach-Object { wevtutil cl "$_" 2>$null | Out-Null }
          Optimize-Volume -DriveLetter C -ReTrim -ErrorAction SilentlyContinue 2>$null | Out-Null
          $global:LASTEXITCODE = 0

      - name: Repair Critical Services
        run: |
          $keepSvc = @(
              "TermService","UmRdpService","SessionEnv","RemoteAccess",
              "mpssvc","BFE","WinRM","RpcLocator","TrustedInstaller",
              "RpcSs","DcomLaunch","RpcEptMapper","nsi","Dnscache","netprofm","NlaSvc",
              "iphlpsvc","WinHttpAutoProxySvc","Dhcp","LanmanServer","LanmanWorkstation",
              "Tailscale","UserDataSvc","UnistoreSvc","UserManager","TokenBroker",
              "ClipSVC","LicenseManager","InstallService","AppXSvc","StateRepository",
              "ShellHWDetection","Themes","FontCache","Audiosrv","AudioEndpointBuilder",
              "BrokerInfrastructure","SystemEventsBroker","EventLog","EventSystem","Schedule",
              "ProfSvc","gpsvc","Winmgmt","DPS","WdiServiceHost","WdiSystemHost",
              "CryptSvc","KeyIso","SamSs"
          )
          foreach ($svc in $keepSvc) {
              Set-Service -Name $svc -StartupType Automatic -ErrorAction SilentlyContinue
              Start-Service -Name $svc -ErrorAction SilentlyContinue
          }
          Start-Sleep 3
          Stop-Service Tailscale -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          Set-Service Tailscale -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service Tailscale -ErrorAction SilentlyContinue
          Start-Sleep 5
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $tsIP = $null; $r = 0
          while (-not $tsIP -and $r -lt 20) { $tsIP = & $tsExe ip -4 2>$null; if (-not $tsIP) { Start-Sleep 3 }; $r++ }
          if (-not $tsIP) { Write-Error "Tailscale could not be brought back"; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          exit 0

      - name: Memory Optimization
        run: |
          $procToKill = @(
            "SearchIndexer","SearchProtocolHost","SearchFilterHost","SecurityHealthSystray",
            "SecurityHealthService","MpCmdRun","MpDefenderCoreService","smartscreen",
            "Widgets","WidgetService","PhoneExperienceHost","YourPhone","CrossDeviceService",
            "OneDrive","RuntimeBroker","ShellExperienceHost","StartMenuExperienceHost",
            "SearchApp","ApplicationFrameHost","SystemSettings","TextInputHost","ctfmon","dwm"
          )
          foreach ($proc in $procToKill) { Stop-Process -Name $proc -Force -ErrorAction SilentlyContinue }
          
          $svcToStop = @("WinDefend","WdNisSvc","Sense","MsSense","SecurityHealthService","wscsvc","MpDefenderCoreService","SgrmBroker","WdFilter","WdNisDrv","WdBoot","WSearch","SysMain","WerSvc","DiagTrack","dmwappushservice","BITS","MapsBroker","RetailDemo","DusmSvc","FrameServer")
          foreach ($svc in $svcToStop) {
              sc.exe stop $svc 2>$null | Out-Null
              sc.exe config $svc start= disabled 2>$null | Out-Null
              $global:LASTEXITCODE = 0
          }
          
          $cs = 'using System;using System.Runtime.InteropServices;public class M{[DllImport("psapi.dll")]public static extern bool EmptyWorkingSet(IntPtr h);[DllImport("kernel32.dll")]public static extern IntPtr OpenProcess(int a,bool i,int p);[DllImport("kernel32.dll")]public static extern bool CloseHandle(IntPtr h);}'
          try {
              Add-Type -TypeDefinition $cs -ErrorAction Stop
              Get-Process -ErrorAction SilentlyContinue | ForEach-Object {
                  try {
                      $h = [M]::OpenProcess(0x1F0FFF, $false, $_.Id)
                      if ($h -ne [IntPtr]::Zero) {
                          [M]::EmptyWorkingSet($h) | Out-Null
                          [M]::CloseHandle($h) | Out-Null
                      }
                  } catch {}
              }
          } catch {}
          [System.GC]::Collect()
          [System.GC]::WaitForPendingFinalizers()
          [System.GC]::Collect()
          Start-Sleep 5
          exit 0

      - name: Install Firefox
        run: |
          $ErrorActionPreference = 'Continue'
          $url = "https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US"
          $installerPath = "$env:TEMP\firefox_installer.exe"
          try {
              Invoke-WebRequest -Uri $url -OutFile $installerPath -UseBasicParsing -ErrorAction Stop
          } catch {
              exit 1
          }
          Start-Process -FilePath $installerPath -ArgumentList "-ms" -Wait
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          exit 0

      - name: Verify RDP Accessibility
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $tsIP = & $tsExe ip -4
          if (-not $tsIP) { Write-Error "Tailscale IP missing"; exit 1 }
          $r = Test-NetConnection -ComputerName $tsIP -Port 3389
          if (-not $r.TcpTestSucceeded) { Write-Error "RDP port unreachable"; exit 1 }

      - name: Maintain Connection (Self-Healing & Unattended)
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $authKey = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          
          Set-Service -Name Tailscale -StartupType Automatic -ErrorAction SilentlyContinue
          New-ItemProperty -Path 'HKLM:\Software\Tailscale IPN' -Name UnattendedMode -PropertyType String -Value always -Force -ErrorAction SilentlyContinue
          
          while ($true) {
              $tsIP = & $tsExe ip -4 2>$null
              if (-not $tsIP) {
                  Write-Host "[$(Get-Date)] Tailscale baglantisi yok, yeniden baglaniliyor..."
                  Restart-Service -Name Tailscale -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 10
                  & $tsExe set --unattended=true
                  & $tsExe up --authkey=$authKey --hostname=gh-runner-$env:GITHUB_RUN_ID --reset 2>$null
                  Start-Sleep -Seconds 15
                  $tsIP = & $tsExe ip -4 2>$null
                  if (-not $tsIP) {
                      Write-Host "[$(Get-Date)] Yeniden baglanma basarisiz, 60 saniye sonra tekrar denenecek."
                  } else {
                      Write-Host "[$(Get-Date)] Tailscale yeniden baglandi: $tsIP"
                      Write-Host "Address : $tsIP"
                      Write-Host "Username: ERROR-4004"
                      Write-Host "Password: Password!?"
                  }
              } else {
                  Write-Host "[$(Get-Date)] RDP Aktif | Tailscale IP: $tsIP"
                  Write-Host "Address : $tsIP"
                  Write-Host "Username: ERROR-4004"
                  Write-Host "Password: Password!?"
              }
              Start-Sleep -Seconds 300
          }
