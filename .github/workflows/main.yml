name: ERROR-4004

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 3600 # 60 saat
    
    steps:
      # ==========================================
      # 1. DETAYLI SİSTEM BİLGİLERİ
      # ==========================================
      - name: DETAYLI SISTEM DONANIM BILGILERI
        run: |
          Write-Host "================================================================="
          Write-Host "                 DETAYLI SISTEM BILGILERI                        "
          Write-Host "================================================================="
          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          Write-Host "[+] Isletim Sistemi : $($os.Caption) (Build: $($os.BuildNumber))"
          $cpu = Get-CimInstance -ClassName Win32_Processor
          Write-Host "[+] Islemci (CPU)   : $($cpu.Name)"
          $ram = [math]::Round((Get-CimInstance -ClassName Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          Write-Host "[+] RAM Miktari     : $ram GB"
          Write-Host "================================================================="
          exit 0

      # ==========================================
      # 2. EDGE TARAYICISINI KÖKÜNDEN SİL
      # ==========================================
      - name: Edge Tarayicisini ve Kisayollarini Komple Sil
        run: |
          Write-Host "Microsoft Edge ve tum kalintilari siliniyor..."
          Remove-Item -Path "C:\Program Files (x86)\Microsoft\Edge" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\Microsoft\Edge" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Users\Default\Desktop\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Users\Public\Desktop\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Users\runneradmin\Desktop\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Users\ERROR-4004\Desktop\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\*" -Recurse -Force -ErrorAction SilentlyContinue
          exit 0

      - name: Tailscale'i Başlat
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # ==========================================
      # 3. KULLANICIYI OLUŞTUR (KARANLIK MOD İÇİN ÖNCE OLUŞTURMALIYIZ)
      # ==========================================
      - name: Kullanıcı Oluştur, Full Admin Yap ve RDP'yi Etkinleştir
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $Password = ConvertTo-SecureString -AsPlainText "${{ secrets.ERROR_4004_PASSWORD }}" -Force
          if (-not (Get-LocalUser -Name "ERROR-4004" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "ERROR-4004" -Password $Password -PasswordNeverExpires -AccountNeverExpires
          } else { Set-LocalUser -Name "ERROR-4004" -Password $Password }
          Add-LocalGroupMember -Group "Administrators" -Member "ERROR-4004" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "ERROR-4004" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "EnableLUA" -Value 0 -Type DWord -Force
          exit 0

      # ==========================================
      # 4. TEMEL PERFORMANS VE ZORLA ULTIMATE PLAN
      # ==========================================
      - name: Servisleri Kapat ve Ultimate Guc Planini Zorla
        run: |
          Write-Host "Gereksiz servisler ve Docker kapatiliyor..."
          $services = @("SysMain", "WSearch", "Spooler", "DiagTrack", "XblAuthManager", "XblGameSave", "XboxNetApiSvc", "WMPNetworkSvc", "wuauserv", "MapsBroker", "lfsvc", "docker")
          foreach ($svc in $services) { 
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue 
          }
          
          Write-Host "Ultimate Performance Guc Plani zorla muhurluyor..."
          cmd.exe /c "powercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61" > $null 2>&1
          cmd.exe /c "powercfg -setactive e9a42b02-d5df-448d-aa00-03f14749eb61" > $null 2>&1
          
          # Kayit Defterinden Power Plan'i muhurle (Windows ezemesin diye)
          $regPowerPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Power\User\PowerSchemes"
          if (Test-Path $regPowerPath) {
              Set-ItemProperty -Path $regPowerPath -Name "ActivePowerScheme" -Value "e9a42b02-d5df-448d-aa00-03f14749eb61" -Force -ErrorAction SilentlyContinue
          }
          exit 0

      # ==========================================
      # 5. GELİŞMİŞ RDP VE AĞ GECİKMESİNİ DÜŞÜRME
      # ==========================================
      - name: Gelismis RDP ve Ag Optimizasyonu
        run: |
          Write-Host "RDP Gecikme ve Ag Optimizasyonlari yapiliyor..."
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SelectTransport" -Value 2
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "InteractiveDelay" -Value 0
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "fEnableRemoteFX" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "EnableUDPTransport" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "DWMFRAMEINTERVAL" -Value 15 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces\*" -Name "TcpAckFrequency" -Value 1 -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces\*" -Name "TCPNoDelay" -Value 1 -ErrorAction SilentlyContinue
          ipconfig /flushdns
          exit 0

      # ==========================================
      # 6. KARANLIK MODU KULLANICI PROFILINE ZORLA YAZ
      # ==========================================
      - name: Sistem ve Arayuz Hizlandirma (Zorla Karanlik Mod)
        run: |
          Write-Host "Karanlik mod kullanici profiline muhurluyor..."
          
          # ERROR-4004 kullanicisinin kayit defteri dosyasini yukle ve degistir
          $userProfile = "C:\Users\ERROR-4004"
          $ntUserDat = "$userProfile\NTUSER.DAT"
          
          if (Test-Path $ntUserDat) {
              # Profili yükle
              cmd.exe /c "reg load HKU\TempUser `"$ntUserDat`"" > $null 2>&1
              
              # Karanlik mod ayarlarini dogrudan yaz
              cmd.exe /c "reg add `"HKU\TempUser\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize`" /v AppsUseLightTheme /t REG_DWORD /d 0 /f" > $null 2>&1
              cmd.exe /c "reg add `"HKU\TempUser\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize`" /v SystemUsesLightTheme /t REG_DWORD /d 0 /f" > $null 2>&1
              
              # Profili kaldir
              cmd.exe /c "reg unload HKU\TempUser" > $null 2>&1
              Write-Host "Karanlik mod ERROR-4004 profilinde zorla aktif edildi."
          }
          
          # Diger hizlandirmalar
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop\WindowMetrics" -Name "MinAnimate" -Value "0"
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "Wallpaper" -Value ""
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "MenuShowDelay" -Value "0"
          exit 0

      # ==========================================
      # 7. MASAÜSTÜNE SADECE CHROME EKLE
      # ==========================================
      - name: Masaustune Sadece Chrome Ekle
        run: |
          $chromePath = ""
          try {
              $appPath = Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe" -ErrorAction Stop
              $chromePath = $appPath."(default)"
          } catch {
              if (Test-Path "C:\Program Files\Google\Chrome\Application\chrome.exe") { $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe" }
              elseif (Test-Path "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe") { $chromePath = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe" }
          }

          if ($chromePath -ne "") {
              $WshShell = New-Object -ComObject WScript.Shell
              New-Item -ItemType Directory -Force -Path "C:\Users\ERROR-4004\Desktop" | Out-Null
              $Shortcut = $WshShell.CreateShortcut("C:\Users\ERROR-4004\Desktop\Google Chrome.lnk")
              $Shortcut.TargetPath = $chromePath
              $Shortcut.Save()
              New-Item -ItemType Directory -Force -Path "C:\Users\Public\Desktop" | Out-Null
              $Shortcut2 = $WshShell.CreateShortcut("C:\Users\Public\Desktop\Google Chrome.lnk")
              $Shortcut2.TargetPath = $chromePath
              $Shortcut2.Save()
          }
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" -Name "HideIcons" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          exit 0

      # ==========================================
      # 8. GÜVENLİK, KAMERA/MİKROFON KÖKTEN KAPATMA VE PAGEFILE SİLME
      # ==========================================
      - name: Guvenlik, Gizlilik ve Pagefile Ayarlari
        run: |
          # Telemetri
          $telPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection"
          if (-not (Test-Path $telPath)) { New-Item -Path $telPath -Force -ErrorAction SilentlyContinue | Out-Null }
          Set-ItemProperty -Path $telPath -Name "AllowTelemetry" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          
          # KAMERA VE MIKROFONU POLITIKALARLA TAMAMEN KAPAT (HKLM)
          $privacyPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy"
          if (-not (Test-Path $privacyPath)) { New-Item -Path $privacyPath -Force -ErrorAction SilentlyContinue | Out-Null }
          Set-ItemProperty -Path $privacyPath -Name "LetAppsAccessCamera" -Value 2 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $privacyPath -Name "LetAppsAccessMicrophone" -Value 2 -Type DWord -Force -ErrorAction SilentlyContinue
          
          # Pagefile'i CIM ile Kökten Sil (Windows inatla açıyorsa bunu kullan)
          Write-Host "Sanal bellek (Pagefile) kökten siliniyor..."
          $cs = Get-CimInstance -ClassName Win32_ComputerSystem -ErrorAction SilentlyContinue
          if ($cs) {
              Set-CimInstance -InputObject $cs -Property @{AutomaticManagedPagefile = $false} -ErrorAction SilentlyContinue
          }
          # Var olan pagefile ayarlarini sil
          $pageFiles = Get-CimInstance -ClassName Win32_PageFileSetting -ErrorAction SilentlyContinue
          if ($pageFiles) {
              foreach ($pf in $pageFiles) {
                  Remove-CimInstance -InputObject $pf -ErrorAction SilentlyContinue
              }
          }
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" -Name "PagingFiles" -Value @() -Type MultiString -Force -ErrorAction SilentlyContinue
          
          powercfg -h off
          vssadmin delete shadows /all /quiet
          exit 0

      - name: Bağlantı Bilgilerini Göster
        run: |
          Write-Host "===================================="
          Write-Host "  ERROR-4004 ULTIMATE PERFORMANS    "
          Write-Host "===================================="
          Write-Host "Tailscale IP:"
          tailscale ip -4
          Write-Host "Kullanici Adi : ERROR-4004"
          Write-Host "Parola        : (Secrets -> ERROR_4004_PASSWORD)"
          Write-Host "===================================="
          Write-Host "Sistem hazir! Lutfen RDP ile baglanin."
          exit 0
          
      - name: Sistemi 60 Saat Boyunca Açık Tut
        run: |
          Write-Host "Islem tamam. 60 saat uyku basliyor..."
          Start-Sleep -Seconds 216000 
