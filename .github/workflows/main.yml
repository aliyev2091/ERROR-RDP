name: ERROR-4004

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 3600 # 60 saat
    
    steps:
      # ==========================================
      # 1. SİSTEM DONANIM BİLGİLERİ (CPU, RAM, DİSK)
      # ==========================================
      - name: SISTEM DONANIM BILGILERI
        run: |
          Write-Host "================================================================="
          Write-Host "                 SISTEM DONANIM BILGILERI                        "
          Write-Host "================================================================="
          
          $cpu = Get-CimInstance -ClassName Win32_Processor
          Write-Host "[+] Islemci (CPU)   : $($cpu.Name)"
          Write-Host "    -> Cekirdek      : $($cpu.NumberOfCores) Fiziksel / $($cpu.NumberOfLogicalProcessors) Mantiksal"
          
          $ram = [math]::Round((Get-CimInstance -ClassName Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          Write-Host "[+] RAM Miktari     : $ram GB"
          
          $mediaType = "SSD (Varsayilan)"
          try {
              $diskInfo = Get-CimInstance -ClassName Win32_DiskDrive | Where-Object { $_.Index -eq 0 }
              if ($diskInfo.Model -match "NVMe|SSD|Solid State") { $mediaType = "SSD" } 
              elseif ($diskInfo.MediaType -match "Fixed hard disk") { $mediaType = "HDD" }
          } catch {
              try {
                  $disk = Get-PhysicalDisk -ErrorAction Stop | Select-Object -First 1
                  $mediaType = $disk.MediaType
              } catch { $mediaType = "Bilinmiyor" }
          }
          Write-Host "[+] Disk Tipi       : $mediaType"
          
          $diskC = Get-CimInstance -ClassName Win32_LogicalDisk -Filter "DeviceID='C:'"
          $freeGB = [math]::Round($diskC.FreeSpace / 1GB, 2)
          $totalGB = [math]::Round($diskC.Size / 1GB, 2)
          Write-Host "[+] C: Surucusu     : $freeGB GB Bos / $totalGB GB Toplam"
          
          Write-Host "================================================================="
          Write-Host "Ultimate Performans ve Baglanti ayarlari baslatiliyor..."
          exit 0

      - name: Tailscale'i Başlat
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Kullanıcı Oluştur, Full Admin Yap ve RDP'yi Etkinleştir
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $Password = ConvertTo-SecureString -AsPlainText "${{ secrets.ERROR_4004_PASSWORD }}" -Force
          if (-not (Get-LocalUser -Name "ERROR-4004" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "ERROR-4004" -Password $Password -PasswordNeverExpires -AccountNeverExpires
          } else { Set-LocalUser -Name "ERROR-4004" -Password $Password }
          Add-LocalGroupMember -Group "Administrators" -Member "ERROR-4004" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "ERROR-4004" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "EnableLUA" -Value 0 -Type DWord -Force
          exit 0

      # ==========================================
      # 2. TEMEL PERFORMANS VE SERVİS KAPATMA
      # ==========================================
      - name: Servisleri Kapat ve Ultimate Guc Planini Aktif Et
        run: |
          Write-Host "Gereksiz servisler kapatiliyor..."
          $services = @("SysMain", "WSearch", "Spooler", "DiagTrack", "XblAuthManager", "XblGameSave", "XboxNetApiSvc", "WMPNetworkSvc", "wuauserv", "MapsBroker", "lfsvc")
          foreach ($svc in $services) { 
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue 
          }
          
          Write-Host "Ultimate Performance Guc Plani aktif ediliyor..."
          powercfg -setactive e9a42b02-d5df-448d-aa00-03f14749eb61
          exit 0

      # ==========================================
      # 3. GELİŞMİŞ RDP VE AĞ GECİKMESİNİ DÜŞÜRME
      # ==========================================
      - name: Gelismis RDP ve Ag Optimizasyonu
        run: |
          Write-Host "RDP Gecikme ve Ag Optimizasyonlari yapiliyor..."
          
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SelectTransport" -Value 2
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "InteractiveDelay" -Value 0
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "DWMFRAMEINTERVAL" -Value 15 -Type DWord -Force
          
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "MaxDisconnectionTime" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "MaxIdleTime" -Value 0 -Type DWord -Force
          
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces\*" -Name "TcpAckFrequency" -Value 1 -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces\*" -Name "TCPNoDelay" -Value 1 -ErrorAction SilentlyContinue
          
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" -Name "NetworkThrottlingIndex" -Value 4294967295 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" -Name "SystemResponsiveness" -Value 0 -ErrorAction SilentlyContinue
          
          ipconfig /flushdns
          exit 0

      # ==========================================
      # 4. SİSTEM VE ARAYÜZ HIZLANDIRMA (HATA DÜZELTİLDİ)
      # ==========================================
      - name: Sistem ve Arayuz Hizlandirma Ayarlari
        run: |
          Write-Host "Windows Arayuzu ve Gezgini hizlandiriliyor..."
          
          # Gorsel Efektleri Kapatma (Animasyonlar vb.)
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop\WindowMetrics" -Name "MinAnimate" -Value "0"
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "Wallpaper" -Value ""
          
          # Menu Acilma Hizini Sifirlama (Aninda acilir)
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "MenuShowDelay" -Value "0"
          
          # Windows Gezgini (Explorer) Klasor Tarama Gecikmesini Kapatma
          New-Item -Path "HKCU:\Software\Classes\Local Settings\Software\Microsoft\Windows\Shell\Bags\AllFolders\Shell" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "HKCU:\Software\Classes\Local Settings\Software\Microsoft\Windows\Shell\Bags\AllFolders\Shell" -Name "FolderType" -Value "NotSpecified" -ErrorAction SilentlyContinue
          
          # Arka Plan Uygulamalarinin CPU'yu Kisitlamasini Engelleme (Efficiency Mode Kapatma) - HATA DÜZELTİLDİ
          Write-Host "PowerThrottling ayari yapiliyor..."
          $ptPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling"
          try {
              if (-not (Test-Path $ptPath)) {
                  New-Item -Path $ptPath -Force -ErrorAction Stop | Out-Null
              }
              Set-ItemProperty -Path $ptPath -Name "PowerThrottlingOff" -Value 1 -Type DWord -Force -ErrorAction Stop
              Write-Host "PowerThrottling basariyla kapatildi."
          } catch {
              Write-Host "PowerThrottling ayarlanamadi, ancak sistem devam ediyor..."
          }
          
          exit 0

      - name: SANAL BELLEK (PAGEFILE) VE HAZIRDA BEKLETME
        run: |
          Write-Host "Sanal bellek ve hazirda bekletme kapatiliyor..."
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" -Name "PagingFiles" -Value @() -Type MultiString -Force
          powercfg -h off
          vssadmin delete shadows /all /quiet
          exit 0

      - name: Bağlantı Bilgilerini Göster
        run: |
          Write-Host "===================================="
          Write-Host "  ERROR-4004 ULTIMATE PERFORMANS    "
          Write-Host "===================================="
          Write-Host "Tailscale IP:"
          tailscale ip -4
          Write-Host "Kullanici Adi : ERROR-4004"
          Write-Host "Parola        : (Secrets -> ERROR_4004_PASSWORD)"
          Write-Host "===================================="
          Write-Host "Sistem tamamen hazir! Baglanabilirsiniz."
          exit 0
          
      - name: Sistemi 60 Saat Boyunca Açık Tut
        run: |
          Write-Host "Islem tamam. 60 saat uyku basliyor..."
          Start-Sleep -Seconds 216000 
