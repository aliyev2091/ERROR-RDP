name: ERROR-4004

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Show Processor Information
        run: |
          Write-Host "`n==================== PROCESSOR INFORMATION ====================" -ForegroundColor Cyan
          $cpu = Get-CimInstance Win32_Processor
          Write-Host "Processor Name           : $($cpu.Name)"
          Write-Host "Manufacturer             : $($cpu.Manufacturer)"
          Write-Host "Number of Cores          : $($cpu.NumberOfCores)"
          Write-Host "Logical Processors       : $($cpu.NumberOfLogicalProcessors)"
          Write-Host "Max Clock Speed (MHz)    : $($cpu.MaxClockSpeed)"
          Write-Host "Current Clock Speed (MHz): $($cpu.CurrentClockSpeed)"
          Write-Host "Architecture             : $($cpu.Architecture)"
          Write-Host "Socket Designation       : $($cpu.SocketDesignation)"
          Write-Host "Processor ID             : $($cpu.ProcessorId)"
          Write-Host "==============================================================`n" -ForegroundColor Cyan

      - name: Aggressive Safe Cleanup
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Write-Host "`n========== AGGRESSIVE SAFE CLEANUP STARTED ==========" -ForegroundColor Yellow

          # ---------- 1) APPX UYGULAMA SILME ----------
          $safeToRemove = @(
            "Microsoft.BingWeather",
            "Microsoft.BingNews",
            "Microsoft.BingSearch",
            "Microsoft.BingFinance",
            "Microsoft.BingSports",
            "Microsoft.GetHelp",
            "Microsoft.Getstarted",
            "Microsoft.WindowsFeedbackHub",
            "Microsoft.MicrosoftOfficeHub",
            "Microsoft.Todos",
            "Microsoft.PowerAutomateDesktop",
            "Microsoft.Windows.Photos",
            "Microsoft.ScreenSketch",
            "Microsoft.MSPaint",
            "Microsoft.Paint",
            "Microsoft.WindowsCamera",
            "Microsoft.WindowsAlarms",
            "Microsoft.WindowsSoundRecorder",
            "Microsoft.People",
            "Microsoft.SkypeApp",
            "Clipchamp.Clipchamp",
            "Microsoft.Xbox*",
            "Microsoft.GamingApp",
            "Microsoft.GamingServices",
            "Microsoft.ZuneMusic",
            "Microsoft.ZuneVideo",
            "Microsoft.YourPhone",
            "Microsoft.WindowsMaps",
            "Microsoft.MicrosoftSolitaireCollection",
            "Microsoft.549981C3F5F10",
            "MicrosoftTeams",
            "Microsoft.OneDriveSync",
            "Microsoft.MicrosoftStickyNotes",
            "Microsoft.WindowsCommunicationsApps",
            "Microsoft.Wallet",
            "Microsoft.3DBuilder",
            "Microsoft.MixedReality.Portal",
            "Microsoft.Microsoft3DViewer",
            "Microsoft.Office.Sway",
            "Microsoft.OneConnect",
            "Microsoft.Print3D",
            "Microsoft.NetworkSpeedTest",
            "Microsoft.News",
            "Microsoft.Advertising.Xaml",
            "Microsoft.Messaging",
            "Microsoft.OneDrive",
            "Microsoft.WindowsNotepad",
            "MicrosoftCorporationII.QuickAssist",
            "MicrosoftCorporationII.MicrosoftFamily",
            "Microsoft.Windows.DevHome",
            "Microsoft.WindowsCalculator",
            "Microsoft.WindowsStore",
            "Microsoft.StorePurchaseApp",
            "Microsoft.DesktopAppInstaller",
            "Microsoft.WindowsTerminal",
            "Microsoft.Windows.Photos",
            "Microsoft.WebMediaExtensions",
            "Microsoft.WebpImageExtension",
            "Microsoft.HEIFImageExtension",
            "Microsoft.HEVCVideoExtension",
            "Microsoft.VP9VideoExtensions",
            "Microsoft.AV1VideoExtension",
            "Microsoft.MPEG2VideoExtension",
            "Microsoft.RawImageExtension",
            "Microsoft.AVCEncoderVideoExtension"
          )

          foreach ($app in $safeToRemove) {
              try {
                  Get-AppxPackage -Name $app -ErrorAction SilentlyContinue | Remove-AppxPackage -ErrorAction SilentlyContinue 2>$null
              } catch {}
              try {
                  Get-AppxPackage -AllUsers -Name $app -ErrorAction SilentlyContinue | Remove-AppxPackage -AllUsers -ErrorAction SilentlyContinue 2>$null
              } catch {}
              try {
                  Get-AppxProvisionedPackage -Online -ErrorAction SilentlyContinue |
                      Where-Object { $_.DisplayName -like $app } |
                      Remove-AppxProvisionedPackage -Online -ErrorAction SilentlyContinue 2>$null | Out-Null
              } catch {}
          }

          # ---------- 2) EDGE KALDIRMA ----------
          Write-Host "Removing Microsoft Edge..." -ForegroundColor Yellow
          $edgeSetupX86 = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\*\Installer\setup.exe"
          $edgeSetupX64 = "$env:ProgramFiles\Microsoft\Edge\Application\*\Installer\setup.exe"
          Get-ChildItem $edgeSetupX86, $edgeSetupX64 -ErrorAction SilentlyContinue | ForEach-Object {
              Start-Process $_.FullName -ArgumentList "--uninstall", "--system-level", "--verbose-logging", "--force-uninstall" -Wait -ErrorAction SilentlyContinue
          }
          Remove-Item -Path "${env:ProgramFiles(x86)}\Microsoft\Edge" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:ProgramFiles\Microsoft\Edge" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:LOCALAPPDATA\Microsoft\Edge" -Recurse -Force -ErrorAction SilentlyContinue

          # ---------- 3) ONEDRIVE KALDIRMA ----------
          taskkill /f /im OneDrive.exe 2>$null | Out-Null
          taskkill /f /im explorer.exe 2>$null | Out-Null
          if (Test-Path "$env:SystemRoot\SysWOW64\OneDriveSetup.exe") {
              Start-Process "$env:SystemRoot\SysWOW64\OneDriveSetup.exe" -ArgumentList "/uninstall" -Wait -ErrorAction SilentlyContinue
          }
          if (Test-Path "$env:SystemRoot\System32\OneDriveSetup.exe") {
              Start-Process "$env:SystemRoot\System32\OneDriveSetup.exe" -ArgumentList "/uninstall" -Wait -ErrorAction SilentlyContinue
          }
          Remove-Item -Path "$env:LOCALAPPDATA\Microsoft\OneDrive" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:ProgramData\Microsoft OneDrive" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\OneDriveTemp" -Recurse -Force -ErrorAction SilentlyContinue

          # ---------- 4) SERVIS DİSABLE ----------
          $servicesToDisable = @(
            "DiagTrack",
            "dmwappushservice",
            "SysMain",
            "WSearch",
            "XblAuthManager",
            "XblGameSave",
            "XboxGipSvc",
            "XboxNetApiSvc",
            "WMPNetworkSvc",
            "Fax",
            "RemoteRegistry",
            "RetailDemo",
            "MapsBroker",
            "WerSvc",
            "Spooler",
            "TabletInputService",
            "TouchKeyboardAndHandwritingPanelService",
            "PrintNotify",
            "lfsvc",
            "diagnosticshub.standardcollector.service",
            "WpnService",
            "WpnUserService",
            "CDPSvc",
            "CDPUserSvc",
            "OneSyncSvc",
            "PcaSvc",
            "WbioSrvc",
            "BluetoothUserService",
            "bthserv",
            "BTAGService",
            "BthAvctpSvc",
            "SEMgrSvc",
            "NfcCxSC",
            "SmsRouter",
            "SharedAccess",
            "icssvc",
            "SensorService",
            "SensrSvc",
            "SensorDataService",
            "WalletService",
            "AssignedAccessManagerSvc",
            "GraphicsPerfSvc",
            "MessagingService",
            "AJRouter",
            "SNMPTRAP",
            "WpcMonSvc",
            "wisvc",
            "MapsBroker",
            "TrkWks",
            "WMPNetworkSvc",
            "DoSvc",
            "BITS",
            "wuauserv",
            "UsoSvc",
            "WaaSMedicSvc",
            "TrustedInstaller",
            "SessionEnv",
            "UmRdpService",
            "TermService",
            "RemoteAccess",
            "SstpSvc",
            "IKEEXT",
            "PolicyAgent",
            "BFE",
            "mpssvc",
            "WinRM",
            "RpcLocator"
          ) | Where-Object { $_ -notin @("SessionEnv","UmRdpService","TermService","RemoteAccess","mpssvc","BFE","WinRM","RpcLocator","TrustedInstaller","DoSvc","BITS") }

          foreach ($svc in $servicesToDisable) {
              try { Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue 2>$null } catch {}
              try { Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue 2>$null } catch {}
          }

          # RDP için KRİTİK olanları açık tut
          foreach ($keepSvc in @("TermService","UmRdpService","SessionEnv","RemoteAccess","mpssvc","BFE","WinRM","RpcLocator")) {
              try { Set-Service -Name $keepSvc -StartupType Automatic -ErrorAction SilentlyContinue 2>$null } catch {}
              try { Start-Service -Name $keepSvc -ErrorAction SilentlyContinue 2>$null } catch {}
          }

          # ---------- 5) SAHİPLENİP SİLME (takeown + icacls) ----------
          function Nuke-Path($path) {
              if (Test-Path $path) {
                  try {
                      takeown /f "$path" /r /d y 2>$null | Out-Null
                      icacls "$path" /grant administrators:F /t 2>$null | Out-Null
                      Remove-Item -Path "$path" -Recurse -Force -ErrorAction SilentlyContinue
                  } catch {}
              }
          }

          $nukeList = @(
            "$env:TEMP",
            "C:\Windows\Temp",
            "C:\Windows\Prefetch",
            "C:\Windows\SoftwareDistribution\Download",
            "C:\Windows\SoftwareDistribution\DataStore",
            "C:\Windows\DeliveryOptimization",
            "C:\Windows\Logs\CBS",
            "C:\Windows\Logs\DISM",
            "C:\Windows\Logs\MoSetup",
            "C:\Windows\Logs\WindowsUpdate",
            "C:\Windows\Logs\waasmedic",
            "C:\Windows\Logs\SIH",
            "C:\Windows\Logs\NetSetup",
            "C:\Windows\LiveKernelReports",
            "C:\Windows\Minidump",
            "C:\Windows\Panther",
            "C:\Windows\System32\LogFiles",
            "C:\ProgramData\Microsoft\Windows\WER",
            "C:\ProgramData\Microsoft\Windows Defender\Scans",
            "C:\ProgramData\Package Cache",
            "C:\Windows\Downloaded Program Files",
            "C:\Windows\Speech",
            "C:\Windows\Speech_OneCore"
          )

          foreach ($p in $nukeList) { Nuke-Path $p }

          # ---------- 6) WINDOWS SEARCH INDEX SİLME ----------
          Write-Host "Removing Windows Search index..." -ForegroundColor Yellow
          try { Stop-Service WSearch -Force -ErrorAction SilentlyContinue 2>$null } catch {}
          Nuke-Path "C:\ProgramData\Microsoft\Search\Data"

          # ---------- 7) WINDOWS.OLD / RECOVERY / WINRE ----------
          Write-Host "Removing Windows.old / Recovery leftovers..." -ForegroundColor Yellow
          Nuke-Path "C:\Windows.old"
          Nuke-Path "C:\Recovery\WindowsRE"

          # ---------- 8) SÜRÜCÜ DEPOSU VE DİL PAKETLERİ ----------
          Write-Host "Cleaning driver store and language packs..." -ForegroundColor Yellow
          try { pnputil /enum-drivers 2>$null | Out-Null } catch {}
          Get-WindowsDriver -Online -ErrorAction SilentlyContinue | Where-Object { $_.ClassName -eq "Legacy" -or $_.ProviderName -match "Unknown" } | ForEach-Object {
              try { pnputil /delete-driver $_.Driver -uninstall /force 2>$null | Out-Null } catch {}
          }

          # ---------- 9) KULLANICI TEMİZLİĞİ ----------
          $userCleanup = @(
            "C:\Users\*\AppData\Local\Temp",
            "C:\Users\*\AppData\Local\Microsoft\Windows\INetCache",
            "C:\Users\*\AppData\Local\Microsoft\Windows\WebCache",
            "C:\Users\*\AppData\Local\Microsoft\Windows\Explorer",
            "C:\Users\*\AppData\Local\CrashDumps",
            "C:\Users\*\AppData\Local\Packages\*\LocalCache",
            "C:\Users\*\AppData\Local\Packages\*\TempState",
            "C:\Users\*\AppData\Local\Microsoft\Edge",
            "C:\Users\*\AppData\Local\Google\Chrome",
            "C:\Users\Public\Documents",
            "C:\Users\Public\Downloads",
            "C:\Users\Public\Music",
            "C:\Users\Public\Pictures",
            "C:\Users\Public\Videos"
          )
          foreach ($uc in $userCleanup) {
              Get-ChildItem -Path $uc -ErrorAction SilentlyContinue | ForEach-Object {
                  Nuke-Path $_.FullName
              }
          }

          # ---------- 10) GERİ DÖNÜŞÜM KUTUSU ----------
          Nuke-Path 'C:\$Recycle.Bin'

          # ---------- 11) REGISTRY AYARLARI ----------
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v "SubscribedContent-338389Enabled" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v "SoftLandingEnabled" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v "SystemPaneSuggestionsEnabled" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v "SubscribedContent-310093Enabled" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v "SubscribedContent-338388Enabled" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v "SubscribedContent-338393Enabled" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v "SubscribedContent-353694Enabled" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v "SubscribedContent-353696Enabled" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v "SilentInstalledAppsEnabled" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection" /v "AllowTelemetry" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection" /v "AllowTelemetry" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\SgrmBroker" /v "Start" /t REG_DWORD /d 4 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" /v "LargeSystemCache" /t REG_DWORD /d 1 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" /v "DisablePagingExecutive" /t REG_DWORD /d 1 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" /v "ClearPageFileAtShutdown" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters" /v "EnablePrefetcher" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters" /v "EnableSuperfetch" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v "EnableLUA" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v "ConsentPromptBehaviorAdmin" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" /v "NoAutoUpdate" /t REG_DWORD /d 1 /f >$null 2>&1
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" /v "AUOptions" /t REG_DWORD /d 2 /f >$null 2>&1
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects\VisualFXSetting" /v "VisualFXSetting" /t REG_DWORD /d 2 /f >$null 2>&1
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v "VisualFXSetting" /t REG_DWORD /d 2 /f >$null 2>&1
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v "fDenyTSConnections" /t REG_DWORD /d 0 /f >$null 2>&1
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer" /v "NoInstrumentation" /t REG_DWORD /d 1 /f >$null 2>&1

          # ---------- 12) ZAMANLANMIŞ GÖREVLER ----------
          $tasks = @(
            "\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser",
            "\Microsoft\Windows\Application Experience\ProgramDataUpdater",
            "\Microsoft\Windows\Application Experience\StartupAppTask",
            "\Microsoft\Windows\Application Experience\PcaPatchDbTask",
            "\Microsoft\Windows\Customer Experience Improvement Program\Consolidator",
            "\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip",
            "\Microsoft\Windows\Customer Experience Improvement Program\KernelCeipTask",
            "\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector",
            "\Microsoft\Windows\Feedback\Siuf\DmClient",
            "\Microsoft\Windows\Feedback\Siuf\DmClientOnScenarioDownload",
            "\Microsoft\Windows\Windows Error Reporting\QueueReporting",
            "\Microsoft\Windows\Autochk\Proxy",
            "\Microsoft\Windows\CloudExperienceHost\CreateObjectTask",
            "\Microsoft\Windows\DiskFootprint\Diagnostics",
            "\Microsoft\Windows\DiskFootprint\StorageSense",
            "\Microsoft\Windows\Maintenance\WinSAT",
            "\Microsoft\Windows\PI\Sqm-Tasks",
            "\Microsoft\Windows\Power Efficiency Diagnostics\AnalyzeSystem",
            "\Microsoft\Windows\Registry\RegIdleBackup",
            "\Microsoft\Windows\Servicing\StartComponentCleanup",
            "\Microsoft\Windows\Sysmain\HybridDriveCachePrepopulate",
            "\Microsoft\Windows\Sysmain\HybridDriveCacheRebalance",
            "\Microsoft\Windows\Sysmain\ResPriStaticDbSync",
            "\Microsoft\Windows\Sysmain\WsSwapAssessmentTask",
            "\Microsoft\Windows\Time Synchronization\SynchronizeTime",
            "\Microsoft\Windows\UPnP\UPnPHostConfig",
            "\Microsoft\Windows\WDI\ResolutionHost",
            "\Microsoft\Windows\Windows Filtering Platform\BfeOnServiceStartTypeChange",
            "\Microsoft\Windows\Workplace Join\Automatic-Device-Join",
            "\Microsoft\Windows\Defrag\ScheduledDefrag",
            "\Microsoft\Windows\Diagnosis\Scheduled",
            "\Microsoft\Windows\Feedback\Siuf\DmClientOnScenarioDownload"
          )
          foreach ($task in $tasks) {
              schtasks /Change /TN $task /Disable 2>$null | Out-Null
          }

          # ---------- 13) HIBERNATION / POWER / VISUAL ----------
          Write-Host "Disabling hibernation..." -ForegroundColor Yellow
          powercfg -h off 2>$null | Out-Null
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null | Out-Null

          # ---------- 14) DISM CLEANUP ----------
          Write-Host "Running DISM component cleanup..." -ForegroundColor Yellow
          Dism.exe /Online /Cleanup-Image /StartComponentCleanup 2>$null | Out-Null
          Dism.exe /Online /Cleanup-Image /StartComponentCleanup /ResetBase 2>$null | Out-Null

          # ---------- 15) EVENT LOG TEMİZLİĞİ ----------
          Write-Host "Clearing event logs..." -ForegroundColor Yellow
          wevtutil el 2>$null | ForEach-Object { wevtutil cl "$_" 2>$null | Out-Null }

          # ---------- 16) DISK OPTIMIZE ----------
          Write-Host "Optimizing volume..." -ForegroundColor Yellow
          Optimize-Volume -DriveLetter C -ReTrim -ErrorAction SilentlyContinue 2>$null | Out-Null

          Write-Host "========== AGGRESSIVE SAFE CLEANUP COMPLETED ==========`n" -ForegroundColor Green

          Write-Host "`n========== DISK & MEMORY SUMMARY ==========" -ForegroundColor Cyan
          $disk = Get-PSDrive C
          $freeGB = [math]::Round($disk.Free / 1GB, 2)
          $usedGB = [math]::Round($disk.Used / 1GB, 2)
          Write-Host "C: Free: $freeGB GB | Used: $usedGB GB"
          $os = Get-CimInstance Win32_OperatingSystem
          $ramTotal = [math]::Round($os.TotalVisibleMemorySize / 1MB, 2)
          $ramFree = [math]::Round($os.FreePhysicalMemory / 1MB, 2)
          Write-Host "RAM Total: $ramTotal GB | Free: $ramFree GB"
          Write-Host "===========================================`n" -ForegroundColor Cyan

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          $password = "Password!?"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "ERROR-4004" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "ERROR-4004"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "ERROR-4004"
          echo "RDP_CREDS=User: ERROR-4004 | Password: $password" >> $env:GITHUB_ENV
          if (-not (Get-LocalUser -Name "ERROR-4004")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: ERROR-4004"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
