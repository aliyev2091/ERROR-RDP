          )
          foreach ($proc in $procToKill) { Stop-Process -Name $proc -Force -ErrorAction SilentlyContinue }
          
          $svcToStop = @("WinDefend","WdNisSvc","Sense","MsSense","SecurityHealthService","wscsvc","MpDefenderCoreService","SgrmBroker","WdFilter","WdNisDrv","WdBoot","WSearch","SysMain","WerSvc","DiagTrack","dmwappushservice","BITS","MapsBroker","RetailDemo","DusmSvc","FrameServer")
          foreach ($svc in $svcToStop) {
              sc.exe stop $svc 2>$null | Out-Null
              sc.exe config $svc start= disabled 2>$null | Out-Null
              $global:LASTEXITCODE = 0
          }
          
          $cs = 'using System;using System.Runtime.InteropServices;public class M{[DllImport("psapi.dll")]public static extern bool EmptyWorkingSet(IntPtr h);[DllImport("kernel32.dll")]public static extern IntPtr OpenProcess(int a,bool i,int p);[DllImport("kernel32.dll")]public static extern bool CloseHandle(IntPtr h);}'
          try {
              Add-Type -TypeDefinition $cs -ErrorAction Stop
              Get-Process -ErrorAction SilentlyContinue | ForEach-Object {
                  try {
                      $h = [M]::OpenProcess(0x1F0FFF, $false, $_.Id)
                      if ($h -ne [IntPtr]::Zero) {
                          [M]::EmptyWorkingSet($h) | Out-Null
                          [M]::CloseHandle($h) | Out-Null
                      }
                  } catch {}
              }
          } catch {}
          [System.GC]::Collect()
          [System.GC]::WaitForPendingFinalizers()
          [System.GC]::Collect()
          Start-Sleep 5
          exit 0

      - name: Install Firefox
        run: |
          $ErrorActionPreference = 'Continue'
          $url = "https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US"
