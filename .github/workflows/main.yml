            "C:\Users\runneradmin\AppData\Roaming\NuGet","C:\Users\runneradmin\AppData\Local\NuGet\v3-cache",
            "C:\Users\runneradmin\AppData\Local\pip\cache","C:\Users\runneradmin\AppData\Local\npm-cache",
            "C:\Users\runneradmin\AppData\Local\Yarn\Cache","C:\Users\runneradmin\.cache",
            "C:\Program Files\Microsoft\EdgeUpdate","C:\Program Files (x86)\Microsoft\EdgeUpdate",
            "C:\Windows\Temp\*","C:\Windows\Prefetch\*","C:\Windows\SoftwareDistribution\Download\*",
