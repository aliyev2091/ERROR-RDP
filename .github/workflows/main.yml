      - name: Memory Optimization
        run: |
          $procToKill = @(
            "SearchIndexer","SearchProtocolHost","SearchFilterHost","SecurityHealthSystray",
            "SecurityHealthService","MpCmdRun","MpDefenderCoreService","smartscreen",
            "Widgets","WidgetService","PhoneExperienceHost","YourPhone","CrossDeviceService",
            "OneDrive","RuntimeBroker","ShellExperienceHost","StartMenuExperienceHost",
