            "XboxGipSvc","XboxNetApiSvc","WMPNetworkSvc","Fax","RemoteRegistry","RetailDemo",
            "MapsBroker","WerSvc","Spooler","TabletInputService","TouchKeyboardAndHandwritingPanelService",
            "PrintNotify","lfsvc","diagnosticshub.standardcollector.service","WbioSrvc","BluetoothUserService",
            "bthserv","BTAGService","BthAvctpSvc","SEMgrSvc","NfcCxSC","SmsRouter","SensorService",
            "SensrSvc","SensorDataService","WalletService","AssignedAccessManagerSvc","GraphicsPerfSvc",
            "MessagingService","AJRouter","SNMPTRAP","WpcMonSvc","wisvc","DoSvc","wuauserv","UsoSvc",
            "WaaSMedicSvc","PhoneSvc","TapiSrv","SCardSvr","ScDeviceEnum","EntAppSvc","WorkFolders",
            "DusmSvc","FrameServer","RmSvc","CscService","PrintWorkflowUserSvc","PrintDeviceConfigurationService",
            "WiaRpc","stisvc","HvHost","vmicvss","vmicheartbeat","vmickvpexchange","vmicrdv",
            "vmicshutdown","vmictimesync","vmicvmsession","WManSvc","NcaSvc"
